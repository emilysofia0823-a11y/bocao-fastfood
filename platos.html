<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boca'o — Platos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#F7EFDD;--panel:#FFFFFF;--card:#FFFFFF;--border:#E8D9B8;--yellow:#F2B705;--gold-deep:#B38600;--red:#A6182E;--green:#2F9E5B;--blue:#2C6E9E;--text:#1F1B15;--muted:#7A6C58;}
body{background:var(--bg);color:var(--text);font-family:'Manrope',Arial,sans-serif;min-height:100vh;}
header{background:linear-gradient(135deg,#A6182E,#7A0F20);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 3px 14px rgba(122,15,32,.2);}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;color:var(--yellow);letter-spacing:.2px;}
.back{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.15);color:#F7EFDD;font-size:0.75rem;font-weight:700;cursor:pointer;text-decoration:none;}
.back:hover{border-color:var(--yellow);color:var(--yellow);}
.addbtn{margin-left:auto;padding:8px 18px;border-radius:9px;border:none;background:var(--yellow);color:#1F1B15;font-size:0.8rem;font-weight:800;cursor:pointer;}
.logout{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.15);color:#F7EFDD;font-size:0.75rem;font-weight:700;cursor:pointer;}
.logout:hover{border-color:#FFD9DF;color:#FFD9DF;}
.wrap{padding:20px;}
.cat-block{margin-bottom:26px;}
.cat-title{font-family:'Baloo 2',sans-serif;font-size:1.1rem;font-weight:700;color:var(--red);letter-spacing:.2px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border);}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.plato-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:14px;transition:box-shadow .2s;box-shadow:0 2px 0 var(--border);}
.plato-card:hover{box-shadow:0 8px 18px rgba(122,15,32,.15);}
.plato-name{font-weight:800;font-size:0.92rem;margin-bottom:4px;}
.plato-desc{font-size:0.75rem;color:var(--muted);line-height:1.4;margin-bottom:8px;min-height:18px;}
.plato-vars{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.pv-chip{background:var(--bg);color:var(--red);font-size:0.72rem;font-weight:700;padding:3px 9px;border-radius:50px;border:1px solid var(--border);}
.viernes-tag{font-size:0.68rem;color:#B36A1E;font-weight:800;margin-bottom:8px;}
.plato-actions{display:flex;gap:8px;}
.plato-actions button{flex:1;padding:7px;border-radius:7px;border:none;font-size:0.75rem;font-weight:700;cursor:pointer;}
.btn-edit{background:var(--blue);color:#fff;}
.btn-del{background:#FBE2E6;color:var(--red);}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(31,27,21,.7);z-index:500;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--card);border:3px solid var(--red);border-radius:14px;padding:22px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;}
.modal h3{font-family:'Baloo 2',sans-serif;color:var(--red);font-size:1.1rem;font-weight:700;margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{font-size:0.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px;}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:8px;font-size:0.85rem;outline:none;font-family:inherit;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red);}
.field textarea{resize:vertical;min-height:50px;}
.checkfield{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.checkfield input{width:auto;}
.checkfield label{font-size:0.8rem;color:var(--text);}
.var-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.var-row input{flex:1;}
.var-row input.price{max-width:110px;}
.var-row button{background:none;border:none;color:var(--red);font-size:1.1rem;cursor:pointer;flex-shrink:0;}
.add-var-btn{background:var(--bg);border:1px dashed var(--border);color:var(--muted);padding:8px;border-radius:8px;width:100%;cursor:pointer;font-size:0.78rem;font-weight:700;margin-bottom:14px;}
.add-var-btn:hover{border-color:var(--red);color:var(--red);}
.modal-actions{display:flex;gap:8px;}
.mbtn-cancel{flex:1;background:var(--border);border:none;color:var(--muted);padding:11px;border-radius:8px;font-weight:700;cursor:pointer;}
.mbtn-ok{flex:2;background:var(--yellow);border:none;color:#1F1B15;padding:11px;border-radius:8px;font-weight:800;cursor:pointer;}
.datalist-hint{font-size:0.68rem;color:var(--muted);margin-top:3px;}
</style>
</head>
<body>
<header>
  <a class="back" href="panel.html">← Panel</a>
  <div class="logo">🍽️ Platos del menú</div>
  <button class="addbtn" onclick="abrirModal()">+ Nuevo plato</button>
  <button class="logout" onclick="logout()">Salir</button>
</header>
<div class="wrap" id="wrap"><div class="empty">Cargando...</div></div>

<!-- MODAL -->
<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="mTitle">Nuevo plato</h3>
    <div class="field">
      <label>Categoría *</label>
      <input type="text" id="fCategoria" list="catList" placeholder="Ej: 🍔 Hamburguesas"/>
      <datalist id="catList"></datalist>
      <div class="datalist-hint">Elige una categoría existente o escribe una nueva.</div>
    </div>
    <div class="field">
      <label>Nombre del plato *</label>
      <input type="text" id="fNombre" placeholder="Ej: Clásica"/>
    </div>
    <div class="field">
      <label>Descripción / ingredientes</label>
      <textarea id="fDesc" placeholder="Ej: Carne, tomate, lechuga, tártara..."></textarea>
    </div>
    <div class="checkfield">
      <input type="checkbox" id="fViernes"/>
      <label for="fViernes">🗓️ Solo disponible los viernes</label>
    </div>
    <div class="field">
      <label>Precios / variantes *</label>
      <div id="varRows"></div>
      <button class="add-var-btn" onclick="agregarVarRow()">+ Agregar opción de precio</button>
    </div>
    <div class="modal-actions">
      <button class="mbtn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="mbtn-ok" onclick="guardarPlato()">💾 Guardar</button>
    </div>
  </div>
</div>

<script>
var sess=JSON.parse(sessionStorage.getItem('bocao_sess')||'null');
if(!sess||sess.role!=='admin'){window.location.href='/login.html';}
function logout(){sessionStorage.removeItem('bocao_sess');window.location.href='/login.html';}
var CAT_ORDEN=['🍔 Hamburguesas','🌭 Perros Calientes','🍟 Salchipapas','🎁 Combos','➕ Adicionales','🥤 Bebidas','🎉 Promociones'];
var productos=[], editandoId=null;
function fmt(n){return'$'+(n||0).toLocaleString('es-CO');}

function render(){
  var wrap=document.getElementById('wrap');
  if(productos.length===0){wrap.innerHTML='<div class="empty">Sin platos todavía. Usa "+ Nuevo plato" para agregar el primero.</div>';return;}
  var porCat={};
  productos.forEach(function(p){(porCat[p.categoria]=porCat[p.categoria]||[]).push(p);});
  Object.keys(porCat).forEach(function(c){porCat[c].sort(function(a,b){return(a.orden||0)-(b.orden||0);});});
  var cats=Object.keys(porCat);
  var ordered=CAT_ORDEN.filter(function(c){return porCat[c];}).concat(cats.filter(function(c){return CAT_ORDEN.indexOf(c)<0;}).sort());
  wrap.innerHTML='';
  ordered.forEach(function(cat){
    var block=document.createElement('div'); block.className='cat-block';
    var grid=document.createElement('div'); grid.className='items-grid';
    porCat[cat].forEach(function(p){
      var vars=(p.variantes||[]).map(function(v){return'<span class="pv-chip">'+v.label+': '+fmt(v.price)+'</span>';}).join('');
      var card=document.createElement('div'); card.className='plato-card';
      var viernesTag=p.soloViernes?'<div class="viernes-tag">🗓️ Solo viernes</div>':'';
      card.innerHTML='<div class="plato-name">'+p.nombre+'</div><div class="plato-desc">'+(p.desc||'')+'</div>'+viernesTag+'<div class="plato-vars">'+vars+'</div><div class="plato-actions"><button class="btn-edit" onclick="editarPlato(\''+p._id+'\')">✏️ Editar</button><button class="btn-del" onclick="borrarPlato(\''+p._id+'\',\''+p.nombre.replace(/'/g,"\\'")+'\')">🗑 Eliminar</button></div>';
      grid.appendChild(card);
    });
    block.innerHTML='<div class="cat-title">'+cat+'</div>';
    block.appendChild(grid);
    wrap.appendChild(block);
  });
}

function actualizarCatList(){
  var dl=document.getElementById('catList'); dl.innerHTML='';
  var cats=[]; productos.forEach(function(p){if(cats.indexOf(p.categoria)<0)cats.push(p.categoria);});
  CAT_ORDEN.forEach(function(c){if(cats.indexOf(c)<0)cats.push(c);});
  cats.forEach(function(c){var o=document.createElement('option');o.value=c;dl.appendChild(o);});
}

function agregarVarRow(label,price){
  var wrap=document.getElementById('varRows');
  var row=document.createElement('div'); row.className='var-row';
  row.innerHTML='<input type="text" class="vlabel" placeholder="Ej: Con papas" value="'+(label||'')+'"/><input type="number" class="price" placeholder="Precio" value="'+(price||'')+'"/><button onclick="this.parentElement.remove()">✕</button>';
  wrap.appendChild(row);
}

function abrirModal(){
  editandoId=null;
  document.getElementById('mTitle').textContent='Nuevo plato';
  document.getElementById('fCategoria').value='';
  document.getElementById('fNombre').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('fViernes').checked=false;
  document.getElementById('varRows').innerHTML='';
  agregarVarRow('Precio','');
  actualizarCatList();
  document.getElementById('modalOverlay').classList.add('open');
}

function editarPlato(id){
  var p=productos.find(function(x){return x._id===id;});
  if(!p)return;
  editandoId=id;
  document.getElementById('mTitle').textContent='Editar plato';
  document.getElementById('fCategoria').value=p.categoria;
  document.getElementById('fNombre').value=p.nombre;
  document.getElementById('fDesc').value=p.desc||'';
  document.getElementById('fViernes').checked=!!p.soloViernes;
  document.getElementById('varRows').innerHTML='';
  (p.variantes||[]).forEach(function(v){agregarVarRow(v.label,v.price);});
  if((p.variantes||[]).length===0) agregarVarRow('Precio','');
  actualizarCatList();
  document.getElementById('modalOverlay').classList.add('open');
}

function cerrarModal(){document.getElementById('modalOverlay').classList.remove('open');editandoId=null;}

function guardarPlato(){
  var categoria=document.getElementById('fCategoria').value.trim();
  var nombre=document.getElementById('fNombre').value.trim();
  var desc=document.getElementById('fDesc').value.trim();
  var soloViernes=document.getElementById('fViernes').checked;
  if(!categoria){alert('Ingresa la categoría.');return;}
  if(!nombre){alert('Ingresa el nombre del plato.');return;}
  var variantes=[];
  document.querySelectorAll('#varRows .var-row').forEach(function(row){
    var label=row.querySelector('.vlabel').value.trim();
    var price=parseInt(row.querySelector('.price').value)||0;
    if(label && price>0) variantes.push({label:label,price:price});
  });
  if(variantes.length===0){alert('Agrega al menos un precio válido.');return;}
  if(editandoId){
    var p=productos.find(function(x){return x._id===editandoId;});
    window._updateProducto(editandoId,{categoria:categoria,nombre:nombre,desc:desc,soloViernes:soloViernes,variantes:variantes});
  } else {
    var id='custom_'+Date.now();
    window._addProducto({id:id,categoria:categoria,nombre:nombre,desc:desc,soloViernes:soloViernes,variantes:variantes,orden:Date.now()});
  }
  cerrarModal();
}

function borrarPlato(id,nombre){
  if(!confirm('¿Eliminar "'+nombre+'" del menú? Esta acción no se puede deshacer.'))return;
  window._deleteProducto(id);
}

// INIT
window.refrescarProductos=function(lista){
  productos=lista;
  render();
};
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
var app=initializeApp({apiKey:"AIzaSyB7fkzZNNNY5oWt5oSAT-2wSwtJh69TKvs",authDomain:"e703-18361.firebaseapp.com",projectId:"e703-18361",storageBucket:"e703-18361.firebasestorage.app",messagingSenderId:"670782708176",appId:"1:670782708176:web:db6470aa8e73da59a201d5"});
var db=getFirestore(app);
window._addProducto=function(p){
  addDoc(collection(db,'productos'),Object.assign({},p,{fechaCreacion:serverTimestamp()})).catch(function(e){alert('Error al guardar: '+e.message);});
};
window._updateProducto=function(id,data){
  updateDoc(doc(db,'productos',id),data).catch(function(e){alert('Error al actualizar: '+e.message);});
};
window._deleteProducto=function(id){
  deleteDoc(doc(db,'productos',id)).catch(function(e){alert('Error al eliminar: '+e.message);});
};
onSnapshot(collection(db,'productos'),function(snap){
  var lista=[];
  snap.forEach(function(d){lista.push(Object.assign({_id:d.id},d.data()));});
  if(window.refrescarProductos) window.refrescarProductos(lista);
});
</script>
</body>
</html>
