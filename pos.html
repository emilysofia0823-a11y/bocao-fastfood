<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boca'o POS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0d0d0d;--panel:#161616;--card:#1e1e1e;--border:#2a2a2a;--yellow:#FFD700;--red:#CC0000;--green:#22c55e;--text:#f0f0f0;--muted:#777;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
header{background:var(--panel);border-bottom:3px solid var(--yellow);padding:8px 16px;display:flex;align-items:center;gap:16px;flex-shrink:0;}
.logo{font-size:1.1rem;font-weight:900;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;}
.tipo-btns{display:flex;gap:6px;margin-left:8px;}
.tipo-btn{padding:7px 18px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--muted);font-weight:700;cursor:pointer;font-size:0.82rem;transition:all .2s;}
.tipo-btn.active{background:var(--yellow);border-color:var(--yellow);color:#000;}
.cajero{margin-left:auto;font-size:0.8rem;color:var(--muted);}
.cajero strong{color:var(--yellow);}

/* LAYOUT */
.body{display:flex;flex:1;overflow:hidden;}

/* LEFT */
.left{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:2px solid var(--border);}
.cats-bar{display:flex;gap:6px;padding:10px 14px;background:var(--panel);overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border);}
.cats-bar::-webkit-scrollbar{display:none;}
.cat-btn{padding:6px 14px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--muted);font-weight:700;cursor:pointer;font-size:0.78rem;white-space:nowrap;transition:all .2s;flex-shrink:0;}
.cat-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
.search-wrap{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:0.85rem;outline:none;}
.search-wrap input:focus{border-color:var(--yellow);}
.grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-content:start;}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s;user-select:none;}
.item-card:hover{border-color:var(--yellow);transform:translateY(-2px);}
.item-card:active{transform:scale(.97);}
.item-name{font-weight:800;font-size:0.88rem;color:var(--yellow);text-transform:uppercase;line-height:1.2;}
.item-desc{font-size:0.7rem;color:var(--muted);margin:4px 0 8px;line-height:1.4;}
.item-prices{display:flex;gap:5px;flex-wrap:wrap;}
.chip{background:var(--red);color:#fff;font-size:0.72rem;font-weight:800;padding:3px 9px;border-radius:50px;}
.chip.alt{background:#333;color:var(--yellow);}
.no-results{color:var(--muted);text-align:center;margin-top:40px;grid-column:1/-1;}

/* RIGHT */
.right{width:330px;display:flex;flex-direction:column;background:var(--panel);flex-shrink:0;}
.order-head{padding:12px 14px;border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.order-head h2{font-size:0.95rem;font-weight:900;color:var(--yellow);}
.clear-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.78rem;font-weight:700;}
.clear-btn:hover{color:var(--red);}

/* CLIENTE */
.cliente-box{padding:10px 14px;border-bottom:2px solid var(--border);display:none;}
.cliente-box.show{display:block;}
.field{margin-bottom:7px;}
.field label{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px;}
.field input,.field select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:0.82rem;outline:none;font-family:inherit;}
.field input:focus,.field select:focus{border-color:var(--yellow);}
.field select option{background:var(--card);}
.envio-tag{font-size:0.75rem;color:var(--green);font-weight:700;margin-top:3px;}

/* CARRITO */
.cart-list{flex:1;overflow-y:auto;padding:10px 14px;}
.cart-empty{color:var(--muted);text-align:center;margin-top:24px;font-size:0.83rem;line-height:1.6;}
.cart-row{background:var(--card);border-radius:9px;padding:9px 10px;margin-bottom:7px;}
.cart-row-top{display:flex;justify-content:space-between;gap:6px;}
.cart-row-name{font-weight:700;font-size:0.83rem;flex:1;line-height:1.3;}
.cart-row-price{color:var(--yellow);font-weight:800;font-size:0.83rem;white-space:nowrap;}
.cart-row-sub{font-size:0.7rem;color:var(--muted);margin-top:2px;}
.cart-row-notas{font-size:0.7rem;color:#aaa;margin-top:2px;font-style:italic;}
.cart-controls{display:flex;align-items:center;gap:6px;margin-top:6px;}
.qbtn{background:var(--border);border:none;color:var(--text);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:0.85rem;font-weight:900;display:flex;align-items:center;justify-content:center;}
.qnum{font-weight:700;font-size:0.82rem;min-width:18px;text-align:center;}
.del-btn{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;}
.del-btn:hover{color:var(--red);}

/* FOOTER */
.order-footer{padding:12px 14px;border-top:2px solid var(--border);flex-shrink:0;}
.notes-field{margin-bottom:10px;}
.notes-field label{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px;}
.notes-field textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:0.8rem;resize:none;outline:none;font-family:inherit;}
.notes-field textarea:focus{border-color:var(--yellow);}
.totals-box{margin-bottom:10px;}
.t-row{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--muted);margin-bottom:3px;}
.t-row.big{font-size:1rem;font-weight:900;color:var(--text);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
.t-row.big span:last-child{color:var(--yellow);}
.confirm-btn{width:100%;background:var(--yellow);color:#000;border:none;padding:13px;border-radius:10px;font-size:0.95rem;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:transform .15s;}
.confirm-btn:hover{transform:scale(1.02);}
.confirm-btn:disabled{background:#333;color:#555;cursor:not-allowed;transform:none;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--card);border:2px solid var(--yellow);border-radius:14px;padding:22px;width:100%;max-width:360px;}
.modal h3{color:var(--yellow);font-size:1rem;font-weight:900;text-transform:uppercase;margin-bottom:14px;}
.modal-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
.mopt{background:var(--panel);border:2px solid var(--border);border-radius:9px;padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:border-color .2s;}
.mopt:hover,.mopt.sel{border-color:var(--yellow);}
.mopt span:first-child{font-weight:700;font-size:0.88rem;}
.mopt span:last-child{color:var(--yellow);font-weight:800;font-size:0.88rem;}
.mopt-notas{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:8px;font-size:0.82rem;outline:none;margin-bottom:12px;font-family:inherit;}
.mopt-notas:focus{border-color:var(--yellow);}
.modal-actions{display:flex;gap:8px;}
.mbtn-cancel{flex:1;background:var(--border);border:none;color:var(--muted);padding:11px;border-radius:8px;font-weight:700;cursor:pointer;}
.mbtn-ok{flex:2;background:var(--yellow);border:none;color:#000;padding:11px;border-radius:8px;font-weight:800;cursor:pointer;}

/* COMANDA */
.comanda-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:600;align-items:center;justify-content:center;}
.comanda-overlay.open{display:flex;}
.comanda-box{background:#fff;color:#000;border-radius:12px;padding:24px;width:310px;font-family:'Courier New',monospace;}
.com-title{text-align:center;font-size:1rem;font-weight:900;border-bottom:2px dashed #000;padding-bottom:8px;margin-bottom:10px;}
.com-meta{font-size:0.75rem;border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px;line-height:1.7;}
.com-items{margin-bottom:8px;}
.com-item{display:flex;justify-content:space-between;font-size:0.82rem;padding:2px 0;}
.com-obs{font-size:0.72rem;color:#555;font-style:italic;padding-left:10px;}
.com-totals{border-top:2px dashed #000;padding-top:8px;font-size:0.82rem;}
.com-trow{display:flex;justify-content:space-between;padding:1px 0;}
.com-trow.big{font-weight:900;font-size:1rem;margin-top:4px;}
.com-notas{font-size:0.72rem;margin-top:6px;border-top:1px dashed #ccc;padding-top:6px;}
.com-actions{display:flex;gap:8px;margin-top:14px;}
.com-actions button{flex:1;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;border:none;font-size:0.82rem;}
.btn-print{background:#000;color:#fff;}
.btn-next{background:var(--yellow);color:#000;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#222;color:var(--text);padding:9px 22px;border-radius:50px;font-weight:700;font-size:0.82rem;border:1px solid #444;transition:transform .3s;z-index:999;pointer-events:none;white-space:nowrap;}
.toast.on{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

          <option value="Puerto Conga|1500">Puerto Conga — $1.500</option>
          <option value="Puerto Bongoe|1500">Puerto Bongoe — $1.500</option>
          <option value="Puerto Campana|1500">Puerto Campana — $1.500</option>
          <option value="Puerto Acordeón|1500">Puerto Acordeón — $1.500</option>
          <option value="Puerto Timbal|1500">Puerto Timbal — $1.500</option>
          <option value="Ilusión|3000">Ilusión — $3.000</option>
          <option value="Normandía|3000">Normandía — $3.000</option>
        </select>
        <div class="envio-tag" id="envioTag"></div>
      </div>
    </div>

    <div class="cart-list" id="cartList">
      <div class="cart-empty">Aún no hay productos.<br/>Selecciona del menú de la izquierda.</div>
    </div>

    <div class="order-footer">

      <div class="totals-box">
        <div class="t-row"><span>Subtotal</span><span id="tSub">$0</span></div>
        <div class="t-row" id="tEnvioRow" style="display:none"><span>Domicilio</span><span id="tEnvio">$0</span></div>
        <div class="t-row big"><span>TOTAL</span><span id="tTotal">$0</span></div>
      </div>
      <button class="confirm-btn" id="confirmBtn" onclick="confirmar()" disabled>Confirmar Pedido</button>
    </div>
  </div>
</div>

<!-- MODAL VARIANTE -->
<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="mTitle">Elige tu opción</h3>
    <div class="modal-opts" id="mOpts"></div>
    <input class="mopt-notas" id="mNotas" type="text" placeholder="Observaciones (ej: sin cebolla)"/>
    <div class="modal-actions">
      <button class="mbtn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="mbtn-ok" onclick="agregarAlCarrito()">+ Agregar</button>
    </div>
  </div>
</div>

<!-- COMANDA -->
<div class="comanda-overlay" id="comandaOverlay">
  <div class="comanda-box">
    <div id="comandaContent"></div>
    <div class="com-actions">
      <button class="btn-print" onclick="imprimirComanda()">🖨️ Imprimir</button>
      <button class="btn-next" onclick="nuevoPedido()">✅ Nuevo pedido</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ══════════════════════════════════════
// DATOS DEL MENÚ

// ══════════════════════════════════════
// ESTADO
// ══════════════════════════════════════
var cart = [];
var tipo = 'domicilio';
var activeCat = 'hamburguesas';
var pendingItem = null;
var selectedVar = null;
var costoEnvio = 0;
var pedidoNum = parseInt(localStorage.getItem('bocao_num') || '900');

// ══════════════════════════════════════
// TIPO DE PEDIDO
// ══════════════════════════════════════
function setTipo(t) {
  tipo = t;
  document.getElementById('btnDom').classList.toggle('active', t === 'domicilio');
  document.getElementById('btnRec').classList.toggle('active', t === 'recoger');
  var cb = document.getElementById('clienteBox');
  if (t === 'domicilio') {
    cb.classList.add('show');
  } else {
    cb.classList.remove('show');
    costoEnvio = 0;
    document.getElementById('tEnvioRow').style.display = 'none';
    calcTotals();
  }
}

// ══════════════════════════════════════
// BARRIO
// ══════════════════════════════════════
function onBarrio() {
  var val = document.getElementById('cBarrio').value;
  var tag = document.getElementById('envioTag');
  if (val) {
    var parts = val.split('|');
    costoEnvio = parseInt(parts[1]);
    tag.textContent = '✓ Costo de envío: $' + costoEnvio.toLocaleString('es-CO');
    document.getElementById('tEnvioRow').style.display = 'flex';
  } else {
    costoEnvio = 0;
    tag.textContent = '';
    document.getElementById('tEnvioRow').style.display = 'none';
  }
  calcTotals();
}

// ══════════════════════════════════════
// RENDERIZAR CATEGORÍAS
// ══════════════════════════════════════
function renderCats() {
  var bar = document.getElementById('catsBar');
  bar.innerHTML = '';
  Object.keys(MENU).forEach(function(key) {
    var btn = document.createElement('button');
    btn.className = 'cat-btn' + (key === activeCat ? ' active' : '');
    btn.textContent = MENU[key].label;
    btn.onclick = function() {
      activeCat = key;
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      renderGrid(MENU[key].items);
    };
    bar.appendChild(btn);
  });
}

// ══════════════════════════════════════
// RENDERIZAR GRID
// ══════════════════════════════════════
function renderGrid(items) {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!items || items.length === 0) {
    grid.innerHTML = '<div class="no-results">No se encontraron productos.</div>';
    return;
  }
  items.forEach(function(item) {
    var card = document.createElement('div');
    card.className = 'item-card';
    var pricesHTML = '';
    if (item.variants.length === 1) {
      pricesHTML = '<span class="chip">$' + item.variants[0].price.toLocaleString('es-CO') + '</span>';
    } else {
      item.variants.forEach(function(v, i) {
        pricesHTML += '<span class="chip' + (i > 0 ? ' alt' : '') + '">' + v.label + ': $' + v.price.toLocaleString('es-CO') + '</span>';
      });
    }
    card.innerHTML = '<div class="item-name">' + item.name + '</div>' +
      '<div class="item-desc">' + item.desc + '</div>' +
      '<div class="item-prices">' + pricesHTML + '</div>';
    card.onclick = function() { openModal(item); };
    grid.appendChild(card);
  });
}

// ══════════════════════════════════════
// BÚSQUEDA
// ══════════════════════════════════════
function onSearch() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) {
    renderGrid(MENU[activeCat].items);
    return;
  }
  var all = [];
  Object.values(MENU).forEach(function(cat) {
    cat.items.forEach(function(item) {
      if (item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q)) {
        all.push(item);
      }
    });
  });
  renderGrid(all);
}

// ══════════════════════════════════════
// MODAL
// ══════════════════════════════════════
function openModal(item) {
  pendingItem = item;
  selectedVar = item.variants.length === 1 ? item.variants[0] : null;
  document.getElementById('mTitle').textContent = item.name;
  document.getElementById('mNotas').value = '';
  var opts = document.getElementById('mOpts');
  opts.innerHTML = '';
  item.variants.forEach(function(v) {
    var d = document.createElement('div');
    d.className = 'mopt' + (item.variants.length === 1 ? ' sel' : '');
    d.innerHTML = '<span>' + v.label + '</span><span>$' + v.price.toLocaleString('es-CO') + '</span>';
    d.onclick = function() {
      document.querySelectorAll('.mopt').forEach(function(o){ o.classList.remove('sel'); });
      d.classList.add('sel');
      selectedVar = v;
    };
    opts.appendChild(d);
  });
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('mNotas').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  pendingItem = null;
  selectedVar = null;
}

// ══════════════════════════════════════
// AGREGAR AL CARRITO
// ══════════════════════════════════════
function agregarAlCarrito() {
  if (!selectedVar) { toast('⚠️ Elige una opción'); return; }
  var notas = document.getElementById('mNotas').value.trim();
  var catKey = Object.keys(MENU).find(function(k){ return MENU[k].items.find(function(i){ return i.id === pendingItem.id; }); });
  var catLabels = {hamburguesas:'Hamburguesa', perros:'Perro Caliente', salchipapas:'Salchipapa', combos:'Combo', adicionales:'Adicional', bebidas:'Bebida'};
  var fullName = (catLabels[catKey] || '') + ' ' + pendingItem.name;
  var key = pendingItem.id + '|' + selectedVar.label + '|' + notas;
  var ex = cart.find(function(c){ return c.key === key; });
  if (ex) { ex.qty++; } else { cart.push({key:key, id:pendingItem.id, name:fullName.trim(), variant:selectedVar.label, price:selectedVar.price, qty:1, notas:notas}); }
  closeModal();
  renderCart();
  toast('✅ ' + pendingItem.name + ' agregado');
}

// ══════════════════════════════════════
// RENDERIZAR CARRITO
// ══════════════════════════════════════
function renderCart() {
  var el = document.getElementById('cartList');
  if (cart.length === 0) {
    el.innerHTML = '<div class="cart-empty">Aún no hay productos.<br/>Selecciona del menú de la izquierda.</div>';
    document.getElementById('confirmBtn').disabled = true;
    calcTotals();
    return;
  }
  el.innerHTML = '';
  cart.forEach(function(item, idx) {
    var row = document.createElement('div');
    row.className = 'cart-row';
    var varLabel = item.variant !== 'Precio' ? '<div class="cart-row-sub">' + item.variant + '</div>' : '';
    var notasLabel = item.notas ? '<div class="cart-row-notas">📝 ' + item.notas + '</div>' : '';
    row.innerHTML = '<div class="cart-row-top">' +
      '<div class="cart-row-name">' + item.name + '</div>' +
      '<div class="cart-row-price">$' + (item.price * item.qty).toLocaleString('es-CO') + '</div>' +
      '</div>' + varLabel + notasLabel +
      '<div class="cart-controls">' +
      '<button class="qbtn" onclick="chgQty(' + idx + ',-1)">−</button>' +
      '<span class="qnum">' + item.qty + '</span>' +
      '<button class="qbtn" onclick="chgQty(' + idx + ',1)">+</button>' +
      '<button class="del-btn" onclick="delItem(' + idx + ')">🗑</button>' +
      '</div>';
    el.appendChild(row);
  });
  document.getElementById('confirmBtn').disabled = false;
  calcTotals();
}

function chgQty(idx, d) { cart[idx].qty += d; if (cart[idx].qty <= 0) cart.splice(idx, 1); renderCart(); }
function delItem(idx) { cart.splice(idx, 1); renderCart(); }
function clearAll() { if (cart.length > 0 && !confirm('¿Limpiar todo el pedido?')) return; cart = []; costoEnvio = 0; document.getElementById('cBarrio').value = ''; document.getElementById('envioTag').textContent = ''; document.getElementById('tEnvioRow').style.display = 'none'; renderCart(); }

// ══════════════════════════════════════
// TOTALES
// ══════════════════════════════════════
function calcTotals() {
  var sub = cart.reduce(function(s,i){ return s + i.price * i.qty; }, 0);
  var total = sub + costoEnvio;
  document.getElementById('tSub').textContent = '$' + sub.toLocaleString('es-CO');
  document.getElementById('tEnvio').textContent = '$' + costoEnvio.toLocaleString('es-CO');
  document.getElementById('tTotal').textContent = '$' + total.toLocaleString('es-CO');
}

// ══════════════════════════════════════
// CONFIRMAR PEDIDO
// ══════════════════════════════════════
function confirmar() {
  if (cart.length === 0) return;
  if (tipo === 'domicilio') {
    var nombre = document.getElementById('cNombre').value.trim();
    var barrio = document.getElementById('cBarrio').value;
    if (!nombre) { toast('⚠️ Ingresa el nombre del cliente'); return; }
    if (!barrio) { toast('⚠️ Selecciona el barrio'); return; }
  }

  pedidoNum++;
  localStorage.setItem('bocao_num', pedidoNum);

  var sub = cart.reduce(function(s,i){ return s + i.price * i.qty; }, 0);
  var barrioVal = document.getElementById('cBarrio').value;
  var barrioParts = barrioVal ? barrioVal.split('|') : [];

  var pedido = {
    numero: pedidoNum,
    tipo: tipo,
    estado: 'pendiente',
    cajero: 'Kelly',
    cliente: {
      nombre: document.getElementById('cNombre').value.trim(),
      telefono: document.getElementById('cTel').value.trim(),
      direccion: document.getElementById('cDir').value.trim(),
      barrio: barrioParts[0] || '',
      costoEnvio: costoEnvio
    },
    items: cart.map(function(i){ return {nombre:i.name, variante:i.variant==='Precio'?'':i.variant, precio:i.price, cantidad:i.qty, notas:i.notas}; }),
    notasGenerales: document.getElementById('notasGen').value.trim(),
    subtotal: sub,
    costoEnvio: costoEnvio,
    total: sub + costoEnvio,
    metodoPago: null,
    fecha: new Date().toISOString()
  };

  // Guardar en Firebase si está disponible
  if (window._db) {
    window._addDoc(window._collection(window._db, 'pedidos'), Object.assign({}, pedido, {fechaCreacion: window._serverTimestamp()}))
      .then(function(ref){ console.log('Guardado en Firebase:', ref.id); })
      .catch(function(e){ console.warn('Firebase error:', e); });
  }

  mostrarComanda(pedido);
  limpiarCliente();
}

function limpiarCliente() {
  ['cNombre','cTel','cDir'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('cBarrio').value = '';
  document.getElementById('envioTag').textContent = '';
  document.getElementById('tEnvioRow').style.display = 'none';
  document.getElementById('notasGen').value = '';
  costoEnvio = 0;
}

// ══════════════════════════════════════
// COMANDA
// ══════════════════════════════════════
function mostrarComanda(p) {
  var f = function(n){ return '$' + n.toLocaleString('es-CO'); };
  var fecha = new Date().toLocaleString('es-CO');
  var tipoLabel = p.tipo === 'domicilio' ? '🛵 DOMICILIO' : '🏃 RECOGER';
  var html = '<div class="com-title">BOCA\'O FAST FOOD<br/><small style="font-size:0.75rem;">Pedido #' + p.numero + ' — ' + tipoLabel + '</small></div>';
  html += '<div class="com-meta">';
  html += '<div>' + fecha + '</div>';
  html += '<div>Cajero: ' + p.cajero + '</div>';
  if (p.cliente.nombre) html += '<div><strong>Cliente: ' + p.cliente.nombre + '</strong></div>';
  if (p.cliente.telefono) html += '<div>Tel: ' + p.cliente.telefono + '</div>';
  if (p.cliente.direccion) html += '<div>Dir: ' + p.cliente.direccion + '</div>';
  if (p.cliente.barrio) html += '<div>Barrio: ' + p.cliente.barrio + '</div>';
  html += '</div>';
  html += '<div class="com-items">';
  p.items.forEach(function(i){
    html += '<div class="com-item"><span>' + i.cantidad + 'x ' + i.nombre + (i.variante ? ' ('+i.variante+')' : '') + '</span><span>' + f(i.precio * i.cantidad) + '</span></div>';
    if (i.notas) html += '<div class="com-obs">↳ ' + i.notas + '</div>';
  });
  html += '</div>';
  html += '<div class="com-totals">';
  html += '<div class="com-trow"><span>Subtotal</span><span>' + f(p.subtotal) + '</span></div>';
  if (p.costoEnvio > 0) html += '<div class="com-trow"><span>Domicilio (' + p.cliente.barrio + ')</span><span>' + f(p.costoEnvio) + '</span></div>';
  html += '<div class="com-trow big"><span>TOTAL</span><span>' + f(p.total) + '</span></div>';
  if (p.notasGenerales) html += '<div class="com-notas">📝 ' + p.notasGenerales + '</div>';
  html += '</div>';
  document.getElementById('comandaContent').innerHTML = html;
  document.getElementById('comandaOverlay').classList.add('open');
}

function imprimirComanda() {
  var html = document.getElementById('comandaContent').innerHTML;
  var w = window.open('','_blank','width=380,height=600');
  w.document.write('<html><head><style>body{font-family:"Courier New",monospace;padding:16px;font-size:13px;} .com-title{text-align:center;font-weight:900;border-bottom:2px dashed #000;padding-bottom:8px;margin-bottom:8px;} .com-meta{border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px;line-height:1.8;} .com-item{display:flex;justify-content:space-between;} .com-obs{color:#555;font-style:italic;padding-left:10px;} .com-totals{border-top:2px dashed #000;padding-top:8px;} .com-trow{display:flex;justify-content:space-between;} .com-trow.big{font-weight:900;font-size:1rem;} .com-notas{margin-top:6px;border-top:1px dashed #ccc;padding-top:6px;}</style></head><body>' + html + '</body></html>');
  w.document.close();
  w.print();
  w.close();
}

function nuevoPedido() {
  cart = [];
  document.getElementById('comandaOverlay').classList.remove('open');
  renderCart();
}

// ══════════════════════════════════════
// TOAST
// ══════════════════════════════════════
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(function(){ el.classList.remove('on'); }, 2500);
}

// ══════════════════════════════════════
// INICIO
// ══════════════════════════════════════
renderCats();
renderGrid(MENU[activeCat].items);
</script>
