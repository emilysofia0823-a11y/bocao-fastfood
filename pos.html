<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boca'o POS</title>
<script>(function(){var s=JSON.parse(sessionStorage.getItem('bocao_sess')||'null');if(!s||s.role!=='admin'){window.location.href='/login.html';}})();</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0d0d0d;--panel:#161616;--card:#1e1e1e;--border:#2a2a2a;--yellow:#FFD700;--red:#CC0000;--green:#22c55e;--blue:#3b82f6;--text:#f0f0f0;--muted:#777;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

header{background:var(--panel);border-bottom:3px solid var(--yellow);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo{font-size:1rem;font-weight:900;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;white-space:nowrap;}
.tipo-btns{display:flex;gap:6px;}
.tipo-btn{padding:6px 16px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--muted);font-weight:700;cursor:pointer;font-size:0.8rem;transition:all .2s;}
.tipo-btn.active{background:var(--yellow);border-color:var(--yellow);color:#000;}
.header-links{margin-left:auto;display:flex;gap:8px;}
.hlink{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:0.75rem;font-weight:700;cursor:pointer;text-decoration:none;transition:all .2s;}
.hlink:hover{border-color:var(--yellow);color:var(--yellow);}

.body{display:flex;flex:1;overflow:hidden;}

/* LEFT */
.left{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:2px solid var(--border);}
.cats-bar{display:flex;gap:6px;padding:10px 14px;background:var(--panel);overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border);}
.cats-bar::-webkit-scrollbar{display:none;}
.cat-btn{padding:6px 14px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--muted);font-weight:700;cursor:pointer;font-size:0.78rem;white-space:nowrap;transition:all .2s;flex-shrink:0;}
.cat-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
.search-wrap{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:0.85rem;outline:none;}
.search-wrap input:focus{border-color:var(--yellow);}
.grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-content:start;}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s;user-select:none;}
.item-card:hover{border-color:var(--yellow);transform:translateY(-2px);}
.item-card:active{transform:scale(.97);}
.item-name{font-weight:800;font-size:0.88rem;color:var(--yellow);text-transform:uppercase;line-height:1.2;}
.item-desc{font-size:0.7rem;color:var(--muted);margin:4px 0 8px;line-height:1.4;}
.item-prices{display:flex;gap:5px;flex-wrap:wrap;}
.chip{background:var(--red);color:#fff;font-size:0.72rem;font-weight:800;padding:3px 9px;border-radius:50px;}
.chip.alt{background:#333;color:var(--yellow);}
.no-results{color:var(--muted);text-align:center;margin-top:40px;grid-column:1/-1;}

/* RIGHT */
.right{width:340px;display:flex;flex-direction:column;background:var(--panel);flex-shrink:0;height:100%;overflow:hidden;}
.order-head{padding:8px 14px;border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.pedido-num{font-size:1rem;font-weight:900;color:var(--yellow);}
.pedido-tipo{font-size:0.72rem;color:var(--muted);margin-top:1px;}
.clear-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.75rem;font-weight:700;}
.clear-btn:hover{color:var(--red);}

/* campos cliente en 2 columnas para ahorrar espacio */
.cliente-box{padding:8px 14px;border-bottom:2px solid var(--border);display:none;flex-shrink:0;}
.cliente-box.show{display:block;}
.fields-row{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;}
.field{margin-bottom:4px;}
.field.full{grid-column:1/-1;}
.field label{font-size:0.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px;}
.field input,.field select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:7px;font-size:0.8rem;outline:none;font-family:inherit;}
.field input:focus,.field select:focus{border-color:var(--yellow);}
.field select option{background:var(--card);}
.envio-tag{font-size:0.7rem;color:var(--green);font-weight:700;margin-top:1px;}

.cart-list{flex:1;overflow-y:auto;padding:8px 14px;min-height:0;}
.cart-empty{color:var(--muted);text-align:center;margin-top:24px;font-size:0.82rem;line-height:1.7;}
.cart-row{background:var(--card);border-radius:9px;padding:9px 10px;margin-bottom:6px;}
.cart-row-top{display:flex;justify-content:space-between;gap:6px;}
.cart-row-name{font-weight:700;font-size:0.82rem;flex:1;line-height:1.3;}
.cart-row-price{color:var(--yellow);font-weight:800;font-size:0.82rem;white-space:nowrap;}
.cart-row-sub{font-size:0.7rem;color:var(--muted);margin-top:2px;}
.cart-row-notas{font-size:0.7rem;color:#aaa;margin-top:2px;font-style:italic;}
.cart-controls{display:flex;align-items:center;gap:6px;margin-top:6px;}
.qbtn{background:var(--border);border:none;color:var(--text);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:0.85rem;font-weight:900;display:flex;align-items:center;justify-content:center;}
.qnum{font-weight:700;font-size:0.82rem;min-width:18px;text-align:center;}
.del-btn{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;}
.del-btn:hover{color:var(--red);}

.order-footer{padding:10px 14px;border-top:2px solid var(--border);flex-shrink:0;}
.notes-field{margin-bottom:8px;}
.notes-field label{font-size:0.67rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px;}
.notes-field textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:0.8rem;resize:none;outline:none;font-family:inherit;}
.notes-field textarea:focus{border-color:var(--yellow);}
.totals-box{margin-bottom:8px;}
.t-row{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--muted);margin-bottom:3px;}
.t-row.big{font-size:1rem;font-weight:900;color:var(--text);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
.t-row.big span:last-child{color:var(--yellow);}
.confirm-btn{width:100%;background:var(--yellow);color:#000;border:none;padding:13px;border-radius:10px;font-size:0.95rem;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:transform .15s;}
.confirm-btn:hover{transform:scale(1.02);}
.confirm-btn:disabled{background:#333;color:#555;cursor:not-allowed;transform:none;}

/* MODAL VARIANTE */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--card);border:2px solid var(--yellow);border-radius:14px;padding:22px;width:100%;max-width:360px;}
.modal h3{color:var(--yellow);font-size:1rem;font-weight:900;text-transform:uppercase;margin-bottom:14px;}
.modal-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
.mopt{background:var(--panel);border:2px solid var(--border);border-radius:9px;padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:border-color .2s;}
.mopt:hover,.mopt.sel{border-color:var(--yellow);}
.mopt span:first-child{font-weight:700;font-size:0.88rem;}
.mopt span:last-child{color:var(--yellow);font-weight:800;}
.mopt-notas{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:8px;font-size:0.82rem;outline:none;margin-bottom:12px;font-family:inherit;}
.mopt-notas:focus{border-color:var(--yellow);}
.modal-actions{display:flex;gap:8px;}
.mbtn-cancel{flex:1;background:var(--border);border:none;color:var(--muted);padding:11px;border-radius:8px;font-weight:700;cursor:pointer;}
.mbtn-ok{flex:2;background:var(--yellow);border:none;color:#000;padding:11px;border-radius:8px;font-weight:800;cursor:pointer;}

/* COMANDA OVERLAY */
.com-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:600;align-items:center;justify-content:center;padding:20px;}
.com-overlay.open{display:flex;}
.com-box{background:#fff;color:#000;border-radius:12px;padding:22px;width:300px;font-family:'Courier New',monospace;max-height:90vh;overflow-y:auto;}
.com-title{text-align:center;font-size:1rem;font-weight:900;border-bottom:2px dashed #000;padding-bottom:8px;margin-bottom:10px;}
.com-meta{font-size:0.74rem;border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px;line-height:1.7;}
.com-items{margin-bottom:8px;}
.com-item{display:flex;justify-content:space-between;font-size:0.8rem;padding:2px 0;}
.com-obs{font-size:0.71rem;color:#555;font-style:italic;padding-left:10px;}
.com-totals{border-top:2px dashed #000;padding-top:8px;font-size:0.8rem;}
.com-trow{display:flex;justify-content:space-between;padding:1px 0;}
.com-trow.big{font-weight:900;font-size:1rem;margin-top:4px;}
.com-notas{font-size:0.71rem;margin-top:6px;border-top:1px dashed #ccc;padding-top:6px;color:#444;}
.com-actions{display:flex;gap:8px;margin-top:14px;}
.com-actions button{flex:1;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;border:none;font-size:0.8rem;}
.btn-print-com{background:#000;color:#fff;}
.btn-cobrar{background:#22c55e;color:#fff;}
.btn-next{background:#eee;color:#000;}

/* PAGO OVERLAY */
.pago-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:700;align-items:center;justify-content:center;padding:20px;}
.pago-overlay.open{display:flex;}
.pago-box{background:var(--card);border:2px solid var(--green);border-radius:14px;padding:24px;width:100%;max-width:360px;}
.pago-box h3{color:var(--green);font-size:1.1rem;font-weight:900;margin-bottom:6px;}
.pago-total{font-size:1.8rem;font-weight:900;color:var(--yellow);margin-bottom:18px;}
.pago-opts{display:flex;gap:8px;margin-bottom:16px;}
.pago-opt{flex:1;background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:12px 6px;cursor:pointer;text-align:center;transition:all .2s;}
.pago-opt:hover,.pago-opt.sel{border-color:var(--green);}
.pago-opt .picon{font-size:1.4rem;display:block;margin-bottom:4px;}
.pago-opt .pname{font-size:0.75rem;font-weight:700;}
.pago-efectivo-wrap{margin-bottom:14px;display:none;}
.pago-efectivo-wrap label{font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px;}
.pago-efectivo-wrap input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:1rem;font-weight:700;outline:none;font-family:inherit;}
.pago-efectivo-wrap input:focus{border-color:var(--green);}
.cambio-tag{font-size:0.85rem;color:var(--green);font-weight:700;margin-top:4px;}
.pago-actions{display:flex;gap:8px;}
.pbtn-cancel{flex:1;background:var(--border);border:none;color:var(--muted);padding:12px;border-radius:10px;font-weight:700;cursor:pointer;}
.pbtn-ok{flex:2;background:var(--green);border:none;color:#fff;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;font-size:0.95rem;}

/* FACTURA OVERLAY */
.fact-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:800;align-items:center;justify-content:center;padding:20px;}
.fact-overlay.open{display:flex;}
.fact-box{background:#fff;color:#000;border-radius:12px;padding:22px;width:300px;font-family:'Courier New',monospace;max-height:90vh;overflow-y:auto;}
.fact-actions{display:flex;gap:8px;margin-top:14px;}
.fact-actions button{flex:1;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;border:none;font-size:0.8rem;}
.btn-print-fact{background:#000;color:#fff;}
.btn-wa-dom{background:#25D366;color:#fff;}
.btn-nuevo{background:#eee;color:#000;}

/* COBRAR PANEL */
.cobrar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:600;align-items:flex-start;justify-content:center;padding:60px 20px 20px;}
.cobrar-overlay.open{display:flex;}
.cobrar-box{background:var(--card);border:2px solid var(--green);border-radius:16px;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;}
.cobrar-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.cobrar-head h3{color:var(--green);font-size:1rem;font-weight:900;}
.cobrar-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;}
.cobrar-list{overflow-y:auto;padding:12px;}
.cobrar-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s;}
.cobrar-card:hover{border-color:var(--green);}
.cobrar-card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.cobrar-num{background:var(--red);color:#fff;font-weight:900;font-size:0.78rem;padding:3px 10px;border-radius:50px;}
.cobrar-num.listo{background:var(--green);color:#000;}
.cobrar-cli{font-weight:700;font-size:0.85rem;flex:1;}
.cobrar-total{color:var(--yellow);font-weight:900;font-size:0.95rem;}
.cobrar-items-sm{font-size:0.75rem;color:var(--muted);line-height:1.5;}
.cobrar-estado{font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:50px;}
.ce-cocina{background:#431407;color:#f97316;}
.ce-listo{background:#14532d;color:var(--green);}
.cobrar-empty{text-align:center;padding:30px;color:var(--muted);font-size:0.85rem;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#222;color:var(--text);padding:9px 22px;border-radius:50px;font-weight:700;font-size:0.82rem;border:1px solid #444;transition:transform .3s;z-index:999;pointer-events:none;white-space:nowrap;}
.toast.on{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="logo">🍔 Boca'o POS</div>
  <div class="tipo-btns">
    <button class="tipo-btn active" id="btnDom" onclick="setTipo('domicilio')">🛵 Domicilio</button>
    <button class="tipo-btn" id="btnRec" onclick="setTipo('recoger')">🏃 Recoger</button>
  </div>
  <div class="header-links">
    <button class="hlink" onclick="abrirCobrarPanel()" id="cobrarHeaderBtn" style="position:relative;">💰 Cobrar <span id="cobrarBadge" style="display:none;background:#22c55e;color:#000;font-size:0.65rem;font-weight:900;border-radius:50%;width:16px;height:16px;line-height:16px;text-align:center;position:absolute;top:-4px;right:-4px;"></span></button>
    <a class="hlink" href="cocina.html" target="_blank">🍳 Cocina</a>
    <a class="hlink" href="ordenes.html" target="_blank">📋 Órdenes</a>
  </div>
</header>

<div class="body">
  <div class="left">
    <div class="cats-bar" id="catsBar"></div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="🔍 Buscar producto..." oninput="onSearch()"/>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="right">
    <div class="order-head">
      <div>
        <div class="pedido-num" id="pedidoNumLabel">Pedido #<span id="pedidoNumVal">—</span></div>
        <div class="pedido-tipo" id="pedidoTipoLabel">🛵 Domicilio</div>
      </div>
      <button class="clear-btn" onclick="clearAll()">🗑 Limpiar</button>
    </div>

    <div class="cliente-box show" id="clienteBox">
      <div class="fields-row">
        <div class="field full">
          <label>Nombre del cliente *</label>
          <input type="text" id="cNombre" placeholder="Nombre completo"/>
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input type="text" id="cTel" placeholder="300 000 0000"/>
        </div>
        <div class="field">
          <label>Dirección</label>
          <input type="text" id="cDir" placeholder="Calle 5 #10-20"/>
        </div>
      </div>
      <div class="field">
        <label>Barrio / Zona *</label>
        <select id="cBarrio" onchange="onBarrio()">
          <option value="">-- Selecciona barrio --</option>
          <option value="Puerto Tambora|500">Puerto Tambora — $500</option>
          <option value="Puerto Armónica|1500">Puerto Armónica — $1.500</option>
          <option value="Puerto Millo|1500">Puerto Millo — $1.500</option>
          <option value="Puerto Cumbia|1500">Puerto Cumbia — $1.500</option>
          <option value="Puerto Gaita|1500">Puerto Gaita — $1.500</option>
          <option value="Puerto Flauta|1500">Puerto Flauta — $1.500</option>
          <option value="Puerto Guitarra|1500">Puerto Guitarra — $1.500</option>
          <option value="Puerto Conga|1500">Puerto Conga — $1.500</option>
          <option value="Puerto Bongoe|1500">Puerto Bongoe — $1.500</option>
          <option value="Puerto Campana|1500">Puerto Campana — $1.500</option>
          <option value="Puerto Acordeón|1500">Puerto Acordeón — $1.500</option>
          <option value="Puerto Timbal|1500">Puerto Timbal — $1.500</option>
          <option value="Ilusión|3000">Ilusión — $3.000</option>
          <option value="Normandía|3000">Normandía — $3.000</option>
        </select>
        <div class="envio-tag" id="envioTag"></div>
      </div>
    </div>

    <div class="cart-list" id="cartList">
      <div class="cart-empty">Aún no hay productos.<br/>Selecciona del menú.</div>
    </div>

    <div class="order-footer">
      <div class="notes-field">
        <label>Notas generales</label>
        <textarea id="notasGen" rows="2" placeholder="Ej: sin cebolla, entregar en portería..."></textarea>
      </div>
      <div class="totals-box">
        <div class="t-row"><span>Subtotal</span><span id="tSub">$0</span></div>
        <div class="t-row" id="tEnvioRow" style="display:none"><span>Domicilio</span><span id="tEnvio">$0</span></div>
        <div class="t-row big"><span>TOTAL</span><span id="tTotal">$0</span></div>
      </div>
      <button class="confirm-btn" id="confirmBtn" onclick="confirmar()" disabled>Enviar a Cocina →</button>
    </div>
  </div>
</div>

<!-- MODAL VARIANTE -->
<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="mTitle">Elige tu opción</h3>
    <div class="modal-opts" id="mOpts"></div>
    <input class="mopt-notas" id="mNotas" type="text" placeholder="Observaciones (ej: sin cebolla)"/>
    <div class="modal-actions">
      <button class="mbtn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="mbtn-ok" onclick="agregarAlCarrito()">+ Agregar</button>
    </div>
  </div>
</div>

<!-- COMANDA -->
<div class="com-overlay" id="comOverlay">
  <div class="com-box">
    <div id="comContent"></div>
    <div class="com-actions">
      <button class="btn-print-com" onclick="imprimirComanda()">🖨️ Imprimir</button>
      <button class="btn-next" onclick="nuevoPedido()">✅ Nuevo pedido</button>
    </div>
  </div>
</div>

<!-- PAGO -->
<div class="pago-overlay" id="pagoOverlay">
  <div class="pago-box">
    <h3>💰 Cobrar pedido</h3>
    <div class="pago-total" id="pagoTotalLabel">$0</div>
    <div class="pago-opts">
      <div class="pago-opt" id="payEfectivo" onclick="selPago('efectivo')">
        <span class="picon">💵</span><span class="pname">Efectivo</span>
      </div>
      <div class="pago-opt" id="payNequi" onclick="selPago('nequi')">
        <span class="picon">📱</span><span class="pname">Nequi</span>
      </div>
      <div class="pago-opt" id="payTransfer" onclick="selPago('transferencia')">
        <span class="picon">🏦</span><span class="pname">Transferencia</span>
      </div>
    </div>
    <div class="pago-efectivo-wrap" id="efectivoWrap">
      <label>Monto recibido</label>
      <input type="number" id="montoRecibido" placeholder="0" oninput="calcCambio()"/>
      <div class="cambio-tag" id="cambioTag"></div>
    </div>
    <div class="pago-actions">
      <button class="pbtn-cancel" onclick="cerrarPago()">Cancelar</button>
      <button class="pbtn-ok" onclick="confirmarPago()">✅ Confirmar pago</button>
    </div>
  </div>
</div>

<!-- FACTURA -->
<div class="fact-overlay" id="factOverlay">
  <div class="fact-box">
    <div id="factContent"></div>
    <div class="fact-actions" id="factActions"></div>
  </div>
</div>

var cart=[], tipo='domicilio', activeCat='hamburguesas';
var pendingItem=null, selectedVar=null, costoEnvio=0;
var pedidoNum=parseInt(localStorage.getItem('bocao_num')||'900');
var pedidoActual=null, metodoPagoSel=null;

function nextNum(){ pedidoNum++; localStorage.setItem('bocao_num',pedidoNum); document.getElementById('pedidoNumVal').textContent=pedidoNum; }

function setTipo(t){
  tipo=t;
  document.getElementById('btnDom').classList.toggle('active',t==='domicilio');
  document.getElementById('btnRec').classList.toggle('active',t==='recoger');
  document.getElementById('clienteBox').classList.toggle('show',t==='domicilio');
  document.getElementById('pedidoTipoLabel').textContent=t==='domicilio'?'🛵 Domicilio':'🏃 Recoger';
  if(t==='recoger'){costoEnvio=0;document.getElementById('tEnvioRow').style.display='none';calcTotals();}
}

function onBarrio(){
  var v=document.getElementById('cBarrio').value,tag=document.getElementById('envioTag');
  if(v){var p=v.split('|');costoEnvio=parseInt(p[1]);tag.textContent='✓ Envío: $'+costoEnvio.toLocaleString('es-CO');document.getElementById('tEnvioRow').style.display='flex';}
  else{costoEnvio=0;tag.textContent='';document.getElementById('tEnvioRow').style.display='none';}
  calcTotals();
}

function renderCats(){
  var bar=document.getElementById('catsBar'); bar.innerHTML='';
  Object.keys(MENU).forEach(function(k){
    var btn=document.createElement('button');
    btn.className='cat-btn'+(k===activeCat?' active':'');
    btn.textContent=MENU[k].label;
    btn.onclick=function(){activeCat=k;document.getElementById('searchInput').value='';document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');renderGrid(MENU[k].items);};
    bar.appendChild(btn);
  });
}

function renderGrid(items){
  var g=document.getElementById('grid'); g.innerHTML='';
  if(!items||items.length===0){g.innerHTML='<div class="no-results">No se encontraron productos.</div>';return;}
  items.forEach(function(item){
    var c=document.createElement('div'); c.className='item-card';
    var ph=item.variants.length===1?'<span class="chip">$'+item.variants[0].price.toLocaleString('es-CO')+'</span>':item.variants.map(function(v,i){return'<span class="chip'+(i>0?' alt':'')+'">'+v.label+': $'+v.price.toLocaleString('es-CO')+'</span>';}).join('');
    c.innerHTML='<div class="item-name">'+item.name+'</div><div class="item-desc">'+item.desc+'</div><div class="item-prices">'+ph+'</div>';
    c.onclick=function(){openModal(item);}; g.appendChild(c);
  });
}

function onSearch(){
  var q=document.getElementById('searchInput').value.toLowerCase().trim();
  if(!q){renderGrid(MENU[activeCat].items);return;}
  var all=[];Object.values(MENU).forEach(function(cat){cat.items.forEach(function(i){if(i.name.toLowerCase().includes(q)||i.desc.toLowerCase().includes(q))all.push(i);});});
  renderGrid(all);
}

function openModal(item){
  pendingItem=item; selectedVar=item.variants.length===1?item.variants[0]:null;
  document.getElementById('mTitle').textContent=item.name;
  document.getElementById('mNotas').value='';
  var opts=document.getElementById('mOpts'); opts.innerHTML='';
  item.variants.forEach(function(v){
    var d=document.createElement('div'); d.className='mopt'+(item.variants.length===1?' sel':'');
    d.innerHTML='<span>'+v.label+'</span><span>$'+v.price.toLocaleString('es-CO')+'</span>';
    d.onclick=function(){document.querySelectorAll('.mopt').forEach(function(o){o.classList.remove('sel');});d.classList.add('sel');selectedVar=v;};
    opts.appendChild(d);
  });
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open');pendingItem=null;selectedVar=null;}

function agregarAlCarrito(){
  if(!selectedVar){toast('⚠️ Elige una opción');return;}
  var notas=document.getElementById('mNotas').value.trim();
  var catKey=Object.keys(MENU).find(function(k){return MENU[k].items.find(function(i){return i.id===pendingItem.id;});});
  var labels={hamburguesas:'Hamburguesa',perros:'Perro Caliente',salchipapas:'Salchipapa',combos:'Combo',adicionales:'Adicional',bebidas:'Bebida'};
  var fullName=(labels[catKey]||'')+' '+pendingItem.name;
  var key=pendingItem.id+'|'+selectedVar.label+'|'+notas;
  var ex=cart.find(function(c){return c.key===key;});
  if(ex){ex.qty++;}else{cart.push({key:key,id:pendingItem.id,name:fullName.trim(),variant:selectedVar.label,price:selectedVar.price,qty:1,notas:notas});}
  closeModal(); renderCart(); toast('✅ '+pendingItem.name+' agregado');
}

function renderCart(){
  var el=document.getElementById('cartList');
  if(cart.length===0){el.innerHTML='<div class="cart-empty">Aún no hay productos.<br/>Selecciona del menú.</div>';document.getElementById('confirmBtn').disabled=true;calcTotals();return;}
  el.innerHTML='';
  cart.forEach(function(item,idx){
    var row=document.createElement('div'); row.className='cart-row';
    var vl=item.variant!=='Precio'?'<div class="cart-row-sub">'+item.variant+'</div>':'';
    var nl=item.notas?'<div class="cart-row-notas">📝 '+item.notas+'</div>':'';
    row.innerHTML='<div class="cart-row-top"><div class="cart-row-name">'+item.name+'</div><div class="cart-row-price">$'+(item.price*item.qty).toLocaleString('es-CO')+'</div></div>'+vl+nl+'<div class="cart-controls"><button class="qbtn" onclick="chgQty('+idx+',-1)">−</button><span class="qnum">'+item.qty+'</span><button class="qbtn" onclick="chgQty('+idx+',1)">+</button><button class="del-btn" onclick="delItem('+idx+')">🗑</button></div>';
    el.appendChild(row);
  });
  document.getElementById('confirmBtn').disabled=false; calcTotals();
}

function chgQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart();}
function delItem(i){cart.splice(i,1);renderCart();}
function clearAll(){if(cart.length>0&&!confirm('¿Limpiar pedido?'))return;cart=[];costoEnvio=0;document.getElementById('cBarrio').value='';document.getElementById('envioTag').textContent='';document.getElementById('tEnvioRow').style.display='none';renderCart();}

function calcTotals(){
  var sub=cart.reduce(function(s,i){return s+i.price*i.qty;},0),total=sub+costoEnvio;
  document.getElementById('tSub').textContent='$'+sub.toLocaleString('es-CO');
  document.getElementById('tEnvio').textContent='$'+costoEnvio.toLocaleString('es-CO');
  document.getElementById('tTotal').textContent='$'+total.toLocaleString('es-CO');
}

function confirmar(){
  if(cart.length===0)return;
  if(tipo==='domicilio'){
    if(!document.getElementById('cNombre').value.trim()){toast('⚠️ Ingresa el nombre del cliente');return;}
    if(!document.getElementById('cBarrio').value){toast('⚠️ Selecciona el barrio');return;}
  }
  var sub=cart.reduce(function(s,i){return s+i.price*i.qty;},0);
  var bv=document.getElementById('cBarrio').value, bp=bv?bv.split('|'):[];
  nextNum();
  var pedido={
    numero:pedidoNum, tipo:tipo, estado:'en_cocina', cajero:'Kelly',
    cliente:{nombre:document.getElementById('cNombre').value.trim(),telefono:document.getElementById('cTel').value.trim(),direccion:document.getElementById('cDir').value.trim(),barrio:bp[0]||'',costoEnvio:costoEnvio},
    items:cart.map(function(i){return{nombre:i.name,variante:i.variant==='Precio'?'':i.variant,precio:i.price,cantidad:i.qty,notas:i.notas};}),
    notasGenerales:document.getElementById('notasGen').value.trim(),
    subtotal:sub, costoEnvio:costoEnvio, total:sub+costoEnvio,
    metodoPago:null, fecha:new Date().toISOString()
  };
  pedidoActual=pedido;
  if(window._db){
    window._addDoc(window._collection(window._db,'pedidos'),Object.assign({},pedido,{fechaCreacion:window._serverTimestamp()}))
      .then(function(ref){pedidoActual.firestoreId=ref.id;console.log('Firebase:',ref.id);})
      .catch(function(e){console.warn(e);});
  }
  mostrarComanda(pedido);
  limpiarCliente();
  cart=[];
  renderCart();
}

function limpiarCliente(){
  ['cNombre','cTel','cDir'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('cBarrio').value='';document.getElementById('envioTag').textContent='';document.getElementById('tEnvioRow').style.display='none';document.getElementById('notasGen').value='';costoEnvio=0;
}

function buildComandaHTML(p){
  var f=function(n){return'$'+n.toLocaleString('es-CO');};
  var fecha=new Date().toLocaleString('es-CO');
  var tl=p.tipo==='domicilio'?'🛵 DOMICILIO':'🏃 RECOGER';
  var h='<div class="com-title">BOCA\'O FAST FOOD<br/><small>Pedido #'+p.numero+' — '+tl+'</small></div>';
  h+='<div class="com-meta"><div>'+fecha+'</div><div>Cajero: '+p.cajero+'</div>';
  if(p.cliente.nombre)h+='<div><strong>'+p.cliente.nombre+'</strong></div>';
  if(p.cliente.telefono)h+='<div>Tel: '+p.cliente.telefono+'</div>';
  if(p.cliente.direccion)h+='<div>Dir: '+p.cliente.direccion+'</div>';
  if(p.cliente.barrio)h+='<div>Barrio: '+p.cliente.barrio+'</div>';
  h+='</div><div class="com-items">';
  p.items.forEach(function(i){h+='<div class="com-item"><span>'+i.cantidad+'x '+i.nombre+(i.variante?' ('+i.variante+')':'')+'</span><span>'+f(i.precio*i.cantidad)+'</span></div>';if(i.notas)h+='<div class="com-obs">↳ '+i.notas+'</div>';});
  h+='</div><div class="com-totals"><div class="com-trow"><span>Subtotal</span><span>'+f(p.subtotal)+'</span></div>';
  if(p.costoEnvio>0)h+='<div class="com-trow"><span>Domicilio ('+p.cliente.barrio+')</span><span>'+f(p.costoEnvio)+'</span></div>';
  h+='<div class="com-trow big"><span>TOTAL</span><span>'+f(p.total)+'</span></div>';
  if(p.notasGenerales)h+='<div class="com-notas">📝 '+p.notasGenerales+'</div>';
  h+='</div>'; return h;
}

function mostrarComanda(p){
  document.getElementById('comContent').innerHTML=buildComandaHTML(p);
  document.getElementById('comOverlay').classList.add('open');
}

function imprimirComanda(){
  var w=window.open('','_blank','width=380,height=600');
  w.document.write('<html><head><style>body{font-family:"Courier New",monospace;padding:16px;font-size:13px;}.com-title{text-align:center;font-weight:900;border-bottom:2px dashed #000;padding-bottom:8px;margin-bottom:10px;}.com-meta{border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px;line-height:1.8;}.com-item{display:flex;justify-content:space-between;}.com-obs{color:#555;font-style:italic;padding-left:10px;}.com-totals{border-top:2px dashed #000;padding-top:8px;}.com-trow{display:flex;justify-content:space-between;}.com-trow.big{font-weight:900;font-size:1.1rem;}.com-notas{margin-top:6px;border-top:1px dashed #ccc;padding-top:6px;color:#444;}</style></head><body>'+document.getElementById('comContent').innerHTML+'</body></html>');
  w.document.close();w.print();w.close();
}

function nuevoPedido(){document.getElementById('comOverlay').classList.remove('open');}

// ── PAGO ──
function abrirPago(){
  if(!pedidoActual)return;
  document.getElementById('comOverlay').classList.remove('open');
  document.getElementById('pagoTotalLabel').textContent='$'+pedidoActual.total.toLocaleString('es-CO');
  document.getElementById('montoRecibido').value='';
  document.getElementById('cambioTag').textContent='';
  document.getElementById('efectivoWrap').style.display='none';
  document.querySelectorAll('.pago-opt').forEach(function(o){o.classList.remove('sel');});
  metodoPagoSel=null;
  document.getElementById('pagoOverlay').classList.add('open');
}

function selPago(m){
  metodoPagoSel=m;
  document.querySelectorAll('.pago-opt').forEach(function(o){o.classList.remove('sel');});
  document.getElementById('pay'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('sel');
  document.getElementById('efectivoWrap').style.display=m==='efectivo'?'block':'none';
  if(m==='efectivo'){document.getElementById('montoRecibido').value=pedidoActual.total;calcCambio();}
}

function calcCambio(){
  var monto=parseInt(document.getElementById('montoRecibido').value)||0;
  var cambio=monto-pedidoActual.total;
  document.getElementById('cambioTag').textContent=cambio>=0?'Cambio: $'+cambio.toLocaleString('es-CO'):'⚠️ Monto insuficiente';
}

function cerrarPago(){document.getElementById('pagoOverlay').classList.remove('open');}

function confirmarPago(){
  if(!metodoPagoSel){toast('⚠️ Selecciona método de pago');return;}
  if(metodoPagoSel==='efectivo'){
    var m=parseInt(document.getElementById('montoRecibido').value)||0;
    if(m<pedidoActual.total){toast('⚠️ El monto es menor al total');return;}
  }
  pedidoActual.metodoPago=metodoPagoSel;
  // Domicilio: queda 'listo' para que el domiciliario lo reciba; Recoger: pasa a 'pagado'
  var nuevoEstado=pedidoActual.tipo==='domicilio'?'listo':'pagado';
  pedidoActual.estado=nuevoEstado;
  if(window._db&&pedidoActual.firestoreId){
    window._updateDoc(window._doc(window._db,'pedidos',pedidoActual.firestoreId),{estado:nuevoEstado,metodoPago:metodoPagoSel}).catch(function(e){console.warn(e);});
  }
  document.getElementById('pagoOverlay').classList.remove('open');
  mostrarFactura(pedidoActual);
}

function mostrarFactura(p){
  var f=function(n){return'$'+n.toLocaleString('es-CO');};
  var fecha=new Date().toLocaleString('es-CO');
  var tl=p.tipo==='domicilio'?'🛵 DOMICILIO':'🏃 RECOGER';
  var mLabels={efectivo:'💵 Efectivo',nequi:'📱 Nequi',transferencia:'🏦 Transferencia'};
  var h='<div class="com-title">BOCA\'O FAST FOOD<br/>573337202914<br/><small>Soledad, Colombia</small></div>';
  h+='<div class="com-meta"><div>'+fecha+'</div><div>Factura #'+p.numero+' — '+tl+'</div><div>Cajero: '+p.cajero+'</div>';
  if(p.cliente.nombre)h+='<div><strong>Cliente: '+p.cliente.nombre+'</strong></div>';
  if(p.cliente.telefono)h+='<div>Tel: '+p.cliente.telefono+'</div>';
  if(p.cliente.direccion)h+='<div>Dir: '+p.cliente.direccion+'</div>';
  if(p.cliente.barrio)h+='<div>Barrio: '+p.cliente.barrio+'</div>';
  if(p.metodoPago)h+='<div>Pago: '+mLabels[p.metodoPago]+'</div>';
  h+='</div><div class="com-items">';
  p.items.forEach(function(i){h+='<div class="com-item"><span>'+i.cantidad+'x '+i.nombre+(i.variante?' ('+i.variante+')':'')+'</span><span>'+f(i.precio*i.cantidad)+'</span></div>';if(i.notas)h+='<div class="com-obs">↳ '+i.notas+'</div>';});
  h+='</div><div class="com-totals"><div class="com-trow"><span>Subtotal</span><span>'+f(p.subtotal)+'</span></div>';
  if(p.costoEnvio>0)h+='<div class="com-trow"><span>Domicilio ('+p.cliente.barrio+')</span><span>'+f(p.costoEnvio)+'</span></div>';
  h+='<div class="com-trow big"><span>TOTAL</span><span>'+f(p.total)+'</span></div>';
  if(p.notasGenerales)h+='<div class="com-notas">📝 '+p.notasGenerales+'</div>';
  h+='<div style="text-align:center;margin-top:10px;font-size:0.75rem;border-top:1px dashed #ccc;padding-top:8px;">¡Gracias por tu pedido! 🍔</div>';
  h+='</div>';
  document.getElementById('factContent').innerHTML=h;

  var acts=document.getElementById('factActions');

function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(function(){el.classList.remove('on');},2500);}

// ── PANEL COBRAR ──
var ordenesActivas=[];

function actualizarBadge(){
  var pendientes=ordenesActivas.filter(function(p){return p.estado!=='pagado'&&p.estado!=='entregado'&&!p.metodoPago;}).length;
  var badge=document.getElementById('cobrarBadge');
  badge.style.display=pendientes>0?'inline-block':'none';
  badge.textContent=pendientes;
}

function abrirCobrarPanel(){
  renderCobrarList();
  document.getElementById('cobrarOverlay').classList.add('open');
}

function renderCobrarList(){
  var lista=ordenesActivas.filter(function(p){return p.estado!=='pagado'&&p.estado!=='entregado'&&!p.metodoPago;});
  var el=document.getElementById('cobrarList');
  if(lista.length===0){el.innerHTML='<div class="cobrar-empty">Sin pedidos pendientes de cobro.</div>';return;}
  el.innerHTML='';
  lista.forEach(function(p){
    var esListo=p.estado==='listo';
    var cli=p.cliente&&p.cliente.nombre?p.cliente.nombre:'Sin nombre';
    var prods=(p.items||[]).map(function(i){return i.cantidad+'× '+i.nombre;}).join(', ');
    var card=document.createElement('div'); card.className='cobrar-card';
    card.innerHTML='<div class="cobrar-card-top"><span class="cobrar-num'+(esListo?' listo':'')+'">'+( esListo?'✅':'🍳')+' #'+p.numero+'</span><span class="cobrar-cli">'+cli+'</span><span class="cobrar-total">$'+p.total.toLocaleString('es-CO')+'</span></div><div class="cobrar-items-sm">'+prods+(p.tipo==='domicilio'?' · 🛵 '+p.cliente.barrio:'')+'</div>';
    card.onclick=function(){
      document.getElementById('cobrarOverlay').classList.remove('open');
      pedidoActual=p;
      abrirPago();
    };
    el.appendChild(card);
  });
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, serverTimestamp, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
try {
  var app=initializeApp({apiKey:"AIzaSyB7fkzZNNNY5oWt5oSAT-2wSwtJh69TKvs",authDomain:"e703-18361.firebaseapp.com",projectId:"e703-18361",storageBucket:"e703-18361.firebasestorage.app",messagingSenderId:"670782708176",appId:"1:670782708176:web:db6470aa8e73da59a201d5"});
  var db=getFirestore(app);
  window._db=db; window._addDoc=addDoc; window._collection=collection;
  window._doc=doc; window._updateDoc=updateDoc; window._serverTimestamp=serverTimestamp;
  // Escuchar TODOS los pedidos, filtrar en JS (no usar where+orderBy = requiere índice compuesto)
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  onSnapshot(collection(db,'pedidos'),function(snap){
    ordenesActivas=[];
    snap.forEach(function(d){
      var p=d.data();
      if(p.estado==='pagado'||p.estado==='entregado') return;
      if(p.metodoPago) return;
      if(p.fecha && new Date(p.fecha)<hoy) return;
      ordenesActivas.push(Object.assign({_id:d.id,firestoreId:d.id},p));
    });
    ordenesActivas.sort(function(a,b){return(a.numero||0)-(b.numero||0);});
    actualizarBadge();
  });
} catch(e){console.warn('Firebase:',e);}
</script>
