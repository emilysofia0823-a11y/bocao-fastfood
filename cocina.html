<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boca'o — Cocina</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;color:#f0f0f0;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;}
header{background:#0d0d0d;border-bottom:3px solid #f97316;padding:10px 18px;display:flex;align-items:center;gap:12px;}
.logo{font-size:1rem;font-weight:900;color:#f97316;text-transform:uppercase;letter-spacing:1px;}
.conn{display:flex;align-items:center;gap:6px;margin-left:auto;}
.dot{width:10px;height:10px;border-radius:50%;background:#333;}
.dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e;}
.conn-txt{font-size:0.75rem;color:#666;}
.snd-btn{padding:5px 12px;border-radius:8px;border:1px solid #2a2a2a;background:#1a1a1a;color:#666;font-size:0.73rem;cursor:pointer;}
.snd-btn.on{border-color:#22c55e;color:#22c55e;}

.tabs{display:flex;gap:6px;padding:12px 18px;background:#0d0d0d;border-bottom:1px solid #1e1e1e;}
.tab{padding:7px 18px;border-radius:50px;border:2px solid #222;background:#1a1a1a;color:#666;font-weight:700;cursor:pointer;font-size:0.8rem;transition:all .2s;}
.tab.active{background:#f97316;border-color:#f97316;color:#fff;}
.cnt{background:#f97316;color:#000;font-size:0.65rem;font-weight:900;border-radius:50px;padding:1px 6px;margin-left:4px;}
.tab.active .cnt{background:#000;color:#f97316;}

.grid{display:flex;flex-wrap:wrap;gap:16px;padding:18px;}

/* COMANDA CARD */
.com-card{background:#fff;color:#000;border-radius:10px;width:280px;font-family:'Courier New',monospace;box-shadow:0 4px 20px rgba(0,0,0,.5);overflow:hidden;flex-shrink:0;}
.com-card.listo{opacity:.6;filter:grayscale(.5);}
.com-header{background:#000;color:#fff;padding:10px 14px;text-align:center;}
.com-header .tipo{font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:2px;}
.com-header .num{font-size:1.2rem;font-weight:900;}
.com-body{padding:12px 14px;}
.com-meta{font-size:0.72rem;border-bottom:1px dashed #ccc;padding-bottom:8px;margin-bottom:8px;line-height:1.8;}
.com-meta strong{font-size:0.85rem;}
.com-items{margin-bottom:8px;}
.com-item{display:flex;justify-content:space-between;font-size:0.82rem;padding:3px 0;border-bottom:1px dashed #eee;}
.com-item:last-child{border-bottom:none;}
.com-obs{font-size:0.7rem;color:#555;font-style:italic;padding-left:8px;padding-bottom:3px;}
.com-notas{background:#fff8e1;border:1px solid #f59e0b;border-radius:6px;padding:6px 10px;font-size:0.72rem;color:#78350f;margin-top:8px;}
.com-fin{text-align:center;font-size:0.68rem;color:#aaa;border-top:1px dashed #ccc;padding-top:8px;margin-top:8px;}
.com-tiempo{text-align:right;font-size:0.68rem;color:#888;margin-top:4px;}
.com-footer{padding:10px 14px;border-top:2px solid #eee;}
.btn-listo{width:100%;background:#000;color:#fff;border:none;padding:11px;border-radius:8px;font-weight:900;cursor:pointer;font-size:0.88rem;letter-spacing:.5px;transition:background .2s;}
.btn-listo:hover{background:#222;}
.btn-ya{width:100%;background:#eee;color:#999;border:none;padding:11px;border-radius:8px;font-weight:700;font-size:0.85rem;cursor:default;}

.empty{text-align:center;padding:60px 20px;color:#444;font-size:0.9rem;}
.empty-icon{font-size:3rem;margin-bottom:12px;}
.error-box{margin:20px;background:#2d0a0a;border:1px solid #CC0000;color:#f87171;border-radius:10px;padding:14px 18px;font-size:0.82rem;}
</style>
</head>
<body>
<header>
  <div class="logo">🍳 Cocina — Boca'o</div>
  <button class="snd-btn" id="sndBtn" onclick="toggleSnd()">🔕 Sonido</button>
  <div class="conn">
    <div class="dot" id="dot"></div>
    <span class="conn-txt" id="connTxt">Conectando...</span>
  </div>
</header>
<div class="tabs">
  <button class="tab active" id="tabAll" onclick="setTab('all')">Todos <span class="cnt" id="cAll">0</span></button>
  <button class="tab" id="tabCocina" onclick="setTab('cocina')">🔥 En cocina <span class="cnt" id="cCocina">0</span></button>
  <button class="tab" id="tabListo" onclick="setTab('listo')">✅ Listos <span class="cnt" id="cListo">0</span></button>
</div>
<div class="grid" id="grid">
  <div class="empty"><div class="empty-icon">🍳</div>Esperando pedidos...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

var cfg={apiKey:"AIzaSyB7fkzZNNNY5oWt5oSAT-2wSwtJh69TKvs",authDomain:"e703-18361.firebaseapp.com",projectId:"e703-18361",storageBucket:"e703-18361.firebasestorage.app",messagingSenderId:"670782708176",appId:"1:670782708176:web:db6470aa8e73da59a201d5"};
var app=initializeApp(cfg);
var db=getFirestore(app);

var todos=[], tab='all', soundOn=false, prevIds=new Set();

document.getElementById('sndBtn').addEventListener('click',function(){});

window.toggleSnd=function(){
  soundOn=!soundOn;
  var b=document.getElementById('sndBtn');
  b.textContent=soundOn?'🔔 Sonido':'🔕 Sonido';
  b.classList.toggle('on',soundOn);
};

window.setTab=function(t){
  tab=t;
  ['All','Cocina','Listo'].forEach(function(k){document.getElementById('tab'+k).classList.remove('active');});
  var m={all:'All',cocina:'Cocina',listo:'Listo'};
  document.getElementById('tab'+m[t]).classList.add('active');
  render();
};

window.marcarListo=function(id){
  updateDoc(doc(db,'pedidos',id),{estado:'listo'}).catch(function(e){alert('Error: '+e.message);});
};

function beep(){
  if(!soundOn)return;
  try{var c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(0.3,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.5);o.start();o.stop(c.currentTime+0.5);}catch(e){}
}

function fmt(n){return'$'+(n||0).toLocaleString('es-CO');}

function tiempoLabel(fecha){
  if(!fecha)return'';
  var diff=Math.floor((Date.now()-new Date(fecha).getTime())/60000);
  if(diff<1)return'Ahora mismo';
  if(diff<60)return diff+' min';
  return Math.floor(diff/60)+'h '+( diff%60)+'m';
}

function render(){
  var grid=document.getElementById('grid');
  var shown=todos;
  if(tab==='cocina') shown=todos.filter(function(p){return p.estado==='en_cocina'||p.estado==='pendiente';});
  if(tab==='listo')  shown=todos.filter(function(p){return p.estado==='listo';});

  var nc=todos.filter(function(p){return p.estado==='en_cocina'||p.estado==='pendiente';}).length;
  var nl=todos.filter(function(p){return p.estado==='listo';}).length;
  document.getElementById('cAll').textContent=todos.length;
  document.getElementById('cCocina').textContent=nc;
  document.getElementById('cListo').textContent=nl;

  if(shown.length===0){
    grid.innerHTML='<div class="empty"><div class="empty-icon">🍳</div>'+(todos.length?'No hay pedidos en esta categoría.':'Esperando pedidos...')+'</div>';
    return;
  }

  grid.innerHTML='';
  shown.forEach(function(p){
    var listo=p.estado==='listo';
    var cli=p.cliente||{};
    var tl=p.tipo==='domicilio'?'🛵 DOMICILIO':'🏃 RECOGER';
    var fecha=p.fecha?new Date(p.fecha).toLocaleString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';

    var itemsHTML=(p.items||[]).map(function(i){
      return'<div class="com-item"><span><strong>'+i.cantidad+'</strong> '+i.nombre+(i.variante&&i.variante!=='Precio'?' ('+i.variante+')':'')+'</span></div>'+(i.notas?'<div class="com-obs">Obs: '+i.notas+'</div>':'');
    }).join('');

    var card=document.createElement('div');
    card.className='com-card'+(listo?' listo':'');
    card.innerHTML=
      '<div class="com-header">'+
        '<div class="tipo">'+tl+'</div>'+
        '<div class="num">#'+p.numero+' — ID '+p.numero+'</div>'+
      '</div>'+
      '<div class="com-body">'+
        '<div class="com-meta">'+
          'Fecha: '+fecha+'<br/>'+
          'Mesero: '+(p.cajero||'Kelly')+'<br/>'+
          (cli.nombre?'<strong>Cliente: '+cli.nombre+'</strong><br/>':'')+
          (cli.telefono?'Tel: '+cli.telefono+'<br/>':'')+
          (p.tipo==='domicilio'&&cli.direccion?'Dir: '+cli.direccion+'<br/>':'')+
          (p.tipo==='domicilio'&&cli.barrio?'Barrio: '+cli.barrio:'')+
        '</div>'+
        '<div class="com-items">'+itemsHTML+'</div>'+
        (p.notasGenerales?'<div class="com-notas">📝 '+p.notasGenerales+'</div>':'')+
        '<div class="com-fin">— Fin de comanda —</div>'+
        '<div class="com-tiempo" id="t'+p._id+'">⏱ '+tiempoLabel(p.fecha)+'</div>'+
      '</div>'+
      '<div class="com-footer">'+
        (listo
          ? '<button class="btn-ya">✅ Pedido listo</button>'
          : '<button class="btn-listo" onclick="marcarListo(\''+p._id+'\')">✅ LISTO — CONFIRMAR</button>'
        )+
      '</div>';
    grid.appendChild(card);
  });
}

// Escuchar pedidos de hoy
var hoy=new Date(); hoy.setHours(0,0,0,0);
var q=query(collection(db,'pedidos'),where('fecha','>=',hoy.toISOString()));
var dot=document.getElementById('dot'), connTxt=document.getElementById('connTxt');

onSnapshot(q, function(snap){
  dot.classList.add('on'); connTxt.textContent='En vivo ✓';
  var newIds=new Set();
  snap.forEach(function(d){newIds.add(d.id);});
  var isNew=false;
  newIds.forEach(function(id){if(!prevIds.has(id))isNew=true;});
  prevIds=newIds;

  todos=[];
  snap.forEach(function(d){
    var p=d.data();
    if(p.estado==='pagado'||p.estado==='entregado') return;
    todos.push(Object.assign({_id:d.id},p));
  });
  todos.sort(function(a,b){return(a.numero||0)-(b.numero||0);});
  if(isNew && prevIds.size>1) beep();
  render();
}, function(err){
  dot.classList.remove('on');
  connTxt.textContent='Error de conexión';
  document.getElementById('grid').innerHTML='<div class="error-box">❌ Error al conectar con Firebase:<br/><strong>'+err.message+'</strong><br/><br/>Verifica las reglas de Firestore en la consola de Firebase.</div>';
  console.error('Firestore error:', err);
});

// Actualizar tiempos cada minuto
setInterval(function(){
  todos.forEach(function(p){
    var el=document.getElementById('t'+p._id);
    if(el) el.textContent='⏱ '+tiempoLabel(p.fecha);
  });
},60000);
</script>
</body>
</html>
