<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boca'o — Órdenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0d0b09;--panel:#171310;--card:#1f1a15;--border:#332a1f;--yellow:#E3B341;--red:#A5293B;--green:#4FA875;--blue:#5B84A8;--orange:#C9793E;--text:#F3ECE2;--muted:#8C8172;}
body{background:var(--bg);color:var(--text);font-family:'Manrope',Arial,sans-serif;min-height:100vh;}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;position:relative;}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--yellow),transparent 70%);}
.logo{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:1.05rem;color:var(--yellow);letter-spacing:.2px;}
.back{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:0.75rem;font-weight:700;cursor:pointer;text-decoration:none;}
.back:hover{border-color:var(--yellow);color:var(--yellow);}
.logout{margin-left:auto;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);font-size:0.75rem;font-weight:700;cursor:pointer;}
.logout:hover{border-color:var(--red);color:var(--red);}
.filter-bar{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--border);}
.fb{padding:7px 16px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--muted);font-size:0.78rem;font-weight:700;cursor:pointer;transition:all .2s;}
.fb.active{border-color:var(--yellow);color:var(--yellow);}
.count{background:var(--yellow);color:#1a1408;font-size:0.68rem;font-weight:900;border-radius:50px;padding:1px 7px;margin-left:4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:18px 20px;}
.card{background:linear-gradient(160deg,var(--card),var(--panel));border:2px solid var(--border);border-radius:16px;overflow:hidden;transition:box-shadow .2s;}
.card:hover{box-shadow:0 12px 26px rgba(0,0,0,.3);}
.card.pendiente{border-color:var(--orange);}
.card.pagado{border-color:var(--green);}
.card.en_camino{border-color:var(--blue);}
.card.entregado{border-color:#3a3128;}
.card-head{padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.num{font-family:'Fraunces',serif;font-weight:700;font-size:0.95rem;color:var(--yellow);}
.tipo-tag{font-size:0.7rem;font-weight:700;padding:3px 9px;border-radius:50px;}
.tdom{background:#202d38;color:#8FB4D4;}.trec{background:#1a2b20;color:#8FC7A8;}
.estado-tag{font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:50px;margin-left:auto;}
.epc{background:#3a2414;color:var(--orange);}
.elisto{background:#1a2b20;color:var(--green);}
.epagado{background:#202d38;color:var(--blue);}
.hora{font-size:0.68rem;color:var(--muted);}
.card-body{padding:8px 14px 12px;}
.cli{font-size:0.8rem;margin-bottom:6px;color:var(--muted);line-height:1.6;}
.cli strong{color:var(--text);}
.items-sm{font-size:0.78rem;}
.isrow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--border);}
.isrow:last-child{border-bottom:none;}
.total-line{display:flex;justify-content:space-between;font-weight:900;margin-top:8px;padding-top:6px;border-top:1px solid var(--border);font-size:0.9rem;}
.total-line span:last-child{color:var(--yellow);}
.empty{text-align:center;padding:50px 20px;color:var(--muted);grid-column:1/-1;}
</style>
</head>
<body>
<header>
  <a class="back" href="panel.html">← Panel</a>
  <div class="logo">📋 Órdenes de hoy</div>
  <button class="logout" onclick="logout()">Salir</button>
</header>
<div class="filter-bar">
  <button class="fb active" id="fAll" onclick="setF('all')">Todos <span class="count" id="cAll">0</span></button>
  <button class="fb" id="fActivos" onclick="setF('activos')">💰 Pendientes de cobro <span class="count" id="cActivos">0</span></button>
  <button class="fb" id="fPagado" onclick="setF('pagado')">✅ Pagados <span class="count" id="cPagado">0</span></button>
  <button class="fb" id="fDom" onclick="setF('domicilio')">🛵 Domicilios <span class="count" id="cDom">0</span></button>
</div>
<div class="grid" id="grid"><div class="empty">Cargando...</div></div>

<script>
var sess=JSON.parse(sessionStorage.getItem('bocao_sess')||'null');
window.sess=sess;
if(!sess||sess.role!=='admin'){window.location.href='/login.html';}
function logout(){sessionStorage.removeItem('bocao_sess');window.location.href='/login.html';}
var todos=[], filtro='all';
function fmt(n){return'$'+(n||0).toLocaleString('es-CO');}
function esPagado(p){return !!p.metodoPago;}
// Sin pantalla de cocina: el estado del pedido es solo pago + entrega (para domicilio).
function cardEstadoKey(p){
  if(p.estadoEntrega==='entregado')return'entregado';
  if(p.estadoEntrega==='en_camino')return'en_camino';
  if(esPagado(p))return'pagado';
  return'pendiente';
}
function estadoLabel(p){
  var m={pendiente:'Pendiente de cobro',pagado:'Pagado',en_camino:'En camino',entregado:'Entregado'};
  return m[cardEstadoKey(p)];
}
function estadoClass(p){
  var k=cardEstadoKey(p);
  if(k==='entregado'||k==='pagado')return'elisto';
  if(k==='en_camino')return'epagado';
  return'epc';
}
window.setF=function(f){
  filtro=f;
  ['All','Activos','Pagado','Dom'].forEach(function(k){document.getElementById('f'+k).classList.remove('active');});
  var m={all:'All',activos:'Activos',pagado:'Pagado',domicilio:'Dom'};
  document.getElementById('f'+m[f]).classList.add('active');
  render();
};
function render(){
  var shown=todos;
  if(filtro==='activos')shown=todos.filter(function(p){return !esPagado(p);});
  else if(filtro==='pagado')shown=todos.filter(function(p){return esPagado(p);});
  else if(filtro==='domicilio')shown=todos.filter(function(p){return p.tipo==='domicilio';});
  document.getElementById('cAll').textContent=todos.length;
  document.getElementById('cActivos').textContent=todos.filter(function(p){return !esPagado(p);}).length;
  document.getElementById('cPagado').textContent=todos.filter(function(p){return esPagado(p);}).length;
  document.getElementById('cDom').textContent=todos.filter(function(p){return p.tipo==='domicilio';}).length;
  var g=document.getElementById('grid'); g.innerHTML='';
  if(shown.length===0){g.innerHTML='<div class="empty">No hay órdenes en esta categoría.</div>';return;}
  shown.forEach(function(p){
    var hora=p.fecha?new Date(p.fecha).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}):'';
    var tTag=p.tipo==='domicilio'?'<span class="tipo-tag tdom">🛵 Dom</span>':'<span class="tipo-tag trec">🏃 Rec</span>';
    var cli=p.cliente||{};
    var cliHTML='';
    if(cli.nombre)cliHTML+='<strong>'+cli.nombre+'</strong><br/>';
    if(cli.direccion)cliHTML+=cli.direccion+'<br/>';
    if(cli.barrio)cliHTML+='Barrio: '+cli.barrio;
    var itemsHTML=(p.items||[]).map(function(i){return'<div class="isrow"><span>'+i.cantidad+'× '+i.nombre+'</span><span style="color:var(--yellow)">'+fmt(i.precio*i.cantidad)+'</span></div>';}).join('');
    var card=document.createElement('div');
    card.className='card '+cardEstadoKey(p);
    var printBtn='<button class="del-x" onclick="reimprimirPedido(\''+p._id+'\')" title="Reimprimir factura" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;margin-left:6px;">🖨️</button>';
    var delBtn='<button class="del-x" onclick="eliminarPedido(\''+p._id+'\',\''+p.numero+'\')" title="Eliminar pedido" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;margin-left:6px;">🗑</button>';
    card.innerHTML='<div class="card-head"><span class="num">#'+p.numero+'</span>'+tTag+'<span class="hora">'+hora+'</span><span class="estado-tag '+estadoClass(p)+'">'+estadoLabel(p)+'</span>'+printBtn+delBtn+'</div><div class="card-body"><div class="cli">'+cliHTML+'</div><div class="items-sm">'+itemsHTML+'</div><div class="total-line"><span>Total</span><span>'+fmt(p.total)+'</span></div></div>';
    g.appendChild(card);
  });
}

window.reimprimirPedido=function(id){
  var pedido=todos.find(function(p){return p._id===id;});
  if(!pedido)return;
  if(!window._reimprimir){alert('⚠️ Sin conexión con la impresora remota.');return;}
  window._reimprimir(pedido);
  alert('🖨️ Factura #'+pedido.numero+' enviada a la impresora.');
};
window.eliminarPedido=function(id,numero){
  var motivo=prompt('¿Por qué vas a eliminar el pedido #'+numero+'? (obligatorio, ej: "pedido de prueba")');
  if(motivo===null)return;
  motivo=motivo.trim();
  if(!motivo){alert('Debes escribir un motivo para eliminar el pedido.');return;}
  if(!confirm('¿Eliminar el pedido #'+numero+' definitivamente? Esta acción no se puede deshacer.'))return;
  var pedido=todos.find(function(p){return p._id===id;});
  if(window._eliminarPedidoConMotivo) window._eliminarPedidoConMotivo(id,motivo,pedido);
};
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
var app=initializeApp({apiKey:"AIzaSyB7fkzZNNNY5oWt5oSAT-2wSwtJh69TKvs",authDomain:"e703-18361.firebaseapp.com",projectId:"e703-18361",storageBucket:"e703-18361.firebasestorage.app",messagingSenderId:"670782708176",appId:"1:670782708176:web:db6470aa8e73da59a201d5"});
var db=getFirestore(app);
window._db=db; window._doc=doc; window._updateDoc=updateDoc;
// Reimpresión remota: encola un trabajo de tipo factura para el agente local
window._reimprimir=function(p){
  addDoc(collection(db,'trabajos_impresion'),{
    tipo:'factura', numero:p.numero, tipoPedido:p.tipo, cajero:p.cajero,
    cliente:p.cliente||{}, items:p.items||[], notasGenerales:p.notasGenerales||'',
    subtotal:p.subtotal||0, costoEnvio:p.costoEnvio||0, total:p.total||0, metodoPago:p.metodoPago||null,
    estado:'pendiente', fecha:new Date().toISOString(), fechaCreacion:serverTimestamp()
  }).catch(function(e){alert('Error al reimprimir: '+e.message);});
};
// Elimina un pedido, pero primero deja registro de auditoría (qué era, quién y por qué)
window._eliminarPedidoConMotivo=function(id,motivo,pedido){
  var registro=Object.assign({},pedido||{},{
    pedidoId:id, motivo:motivo,
    eliminadoPor:(window.sess&&window.sess.nombre)||'admin',
    fechaEliminacion:new Date().toISOString(),
    fechaEliminacionTS:serverTimestamp()
  });
  delete registro._id;
  addDoc(collection(db,'pedidos_eliminados'),registro).catch(function(e){console.warn('audit',e);});
  deleteDoc(doc(db,'pedidos',id)).catch(function(e){alert('Error al eliminar: '+e.message);});
};
var hoy=new Date();hoy.setHours(0,0,0,0);
var q=query(collection(db,'pedidos'),where('fecha','>=',hoy.toISOString()));
onSnapshot(q,function(snap){
  todos=[];
  snap.forEach(function(d){todos.push(Object.assign({_id:d.id},d.data()));});
  todos.sort(function(a,b){return(a.numero||0)-(b.numero||0);});
  render();
});
</script>
</body>
</html>
