<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boca'o — Recetas</title>
<script>(function(){var s=JSON.parse(sessionStorage.getItem('bocao_sess')||'null');if(!s||s.role!=='admin'){window.location.href='/login.html';}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0d0b09;--panel:#171310;--card:#1f1a15;--border:#332a1f;--yellow:#E3B341;--red:#A5293B;--green:#4FA875;--blue:#5B84A8;--orange:#C9793E;--text:#F3ECE2;--muted:#8C8172;}
body{background:var(--bg);color:var(--text);font-family:'Manrope',Arial,sans-serif;min-height:100vh;}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--yellow),transparent 70%);}
.logo{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:1.05rem;color:var(--yellow);letter-spacing:.2px;}
.back{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:0.75rem;font-weight:700;cursor:pointer;text-decoration:none;}
.back:hover{border-color:var(--yellow);color:var(--yellow);}
.logout{margin-left:auto;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);font-size:0.75rem;font-weight:700;cursor:pointer;}
.logout:hover{border-color:var(--red);color:var(--red);}
.intro{padding:16px 20px;color:var(--muted);font-size:0.85rem;line-height:1.5;background:var(--panel);border-bottom:1px solid var(--border);}
.intro strong{color:var(--text);}
.search-wrap{padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);}
.search-wrap input{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;font-size:0.85rem;outline:none;}
.search-wrap input:focus{border-color:var(--yellow);}
.cat-title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700;color:var(--yellow);padding:20px 20px 6px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:6px 20px;}
.card{background:linear-gradient(160deg,var(--card),var(--panel));border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.card-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-name{font-weight:900;font-size:0.95rem;color:var(--text);}
.card-count{font-size:0.68rem;color:var(--muted);background:var(--panel);padding:2px 9px;border-radius:50px;white-space:nowrap;}
.ing-list{padding:6px 14px 12px;}
.ing-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);font-size:0.82rem;}
.ing-row:last-child{border-bottom:none;}
.ing-name{color:var(--text);text-transform:capitalize;}
.ing-qty{color:var(--yellow);font-weight:800;white-space:nowrap;}
.empty{text-align:center;padding:50px;color:var(--muted);}
</style>
</head>
<body>
<header>
  <a class="back" href="panel.html">← Panel</a>
  <div class="logo">📖 Recetas</div>
  <a class="back" href="inventario.html">📦 Ir a Inventario</a>
  <button class="logout" onclick="logout()">Salir</button>
</header>
<div class="intro">
  Cada producto del menú tiene su <strong>receta</strong>: los ingredientes que consume. Cuando tomas un pedido y lo envías a cocina, el sistema <strong>descuenta automáticamente</strong> estas cantidades del inventario.
</div>
<div class="search-wrap">
  <input type="text" id="search" placeholder="🔍 Buscar producto o ingrediente..." oninput="render()"/>
</div>
<div id="cont"><div class="empty">Cargando recetas...</div></div>

<script src="recetas.js"></script>
<script>
function logout(){sessionStorage.removeItem('bocao_sess');window.location.href='/login.html';}
function fmtCant(n){return (Math.round(n*100)/100).toLocaleString('es-CO');}

function render(){
  var q=(document.getElementById('search').value||'').toLowerCase().trim();
  var cont=document.getElementById('cont');
  // agrupar por categoría en el orden de MENU_INFO
  var cats={}, orden=[];
  Object.keys(MENU_INFO).forEach(function(id){
    if(!RECETAS[id]) return;
    var info=MENU_INFO[id];
    // filtro búsqueda: por nombre de producto o por algún ingrediente
    if(q){
      var match=info.nombre.toLowerCase().indexOf(q)>=0;
      if(!match) match=RECETAS[id].some(function(p){return p[0].toLowerCase().indexOf(q)>=0;});
      if(!match) return;
    }
    if(!cats[info.cat]){cats[info.cat]=[];orden.push(info.cat);}
    cats[info.cat].push(id);
  });

  if(orden.length===0){cont.innerHTML='<div class="empty">No se encontró nada con «'+q+'».</div>';return;}

  var html='';
  orden.forEach(function(cat){
    html+='<div class="cat-title">'+cat+'</div><div class="grid">';
    cats[cat].forEach(function(id){
      var info=MENU_INFO[id], receta=RECETAS[id];
      html+='<div class="card"><div class="card-head"><span class="card-name">'+info.nombre+'</span><span class="card-count">'+receta.length+' ingredientes</span></div><div class="ing-list">';
      receta.forEach(function(p){
        html+='<div class="ing-row"><span class="ing-name">'+p[0]+'</span><span class="ing-qty">'+fmtCant(p[1])+' '+unidadDe(p[0])+'</span></div>';
      });
      html+='</div></div>';
    });
    html+='</div>';
  });
  cont.innerHTML=html;
}
render();
</script>
</body>
</html>
