<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boca'o — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --red:#A6182E; --red-deep:#7A0F20;
  --gold:#F2B705; --gold-deep:#D99A00;
  --cream:#F7EFDD; --black:#171310;
  --muted:rgba(247,239,221,.65);
}
body{
  background:
    radial-gradient(ellipse 800px 500px at 50% 0%, rgba(242,183,5,.18), transparent 65%),
    linear-gradient(160deg,var(--red),var(--red-deep));
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  font-family:'Manrope',Arial,sans-serif;color:var(--cream);
}
.card{background:rgba(23,19,16,.28);border:2px solid var(--gold);border-radius:22px;padding:40px 34px;width:100%;max-width:380px;box-shadow:0 25px 70px rgba(0,0,0,.45);backdrop-filter:blur(3px);}
.logo{text-align:center;margin-bottom:32px;}
.logo-icon{font-size:2.8rem;}
.logo-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.4rem;color:var(--gold);letter-spacing:.5px;margin-top:6px;text-shadow:0 3px 0 var(--black);}
.logo-sub{font-size:0.72rem;color:var(--cream);opacity:.85;margin-top:8px;letter-spacing:2px;text-transform:uppercase;font-weight:700;}
.field{margin-bottom:16px;}
.field label{font-size:0.68rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px;}
.field input{width:100%;background:rgba(247,239,221,.95);border:2px solid transparent;color:var(--black);padding:13px 15px;border-radius:11px;font-size:0.95rem;outline:none;font-family:inherit;font-weight:600;transition:all .2s;}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,183,5,.25);}
.btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:var(--black);border:none;padding:15px;border-radius:11px;font-size:0.95rem;font-weight:800;cursor:pointer;margin-top:10px;letter-spacing:.5px;transition:all .2s;box-shadow:0 6px 0 #8a6600;}
.btn:hover{transform:translateY(2px);box-shadow:0 4px 0 #8a6600;}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 #8a6600;}
.error{background:rgba(0,0,0,.3);border:1px solid var(--gold);color:#FFD9DF;border-radius:9px;padding:10px 14px;font-size:0.8rem;margin-top:14px;display:none;text-align:center;}
.error.show{display:block;}
.version{text-align:center;margin-top:24px;font-size:0.66rem;color:var(--cream);opacity:.5;letter-spacing:.5px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🍔</div>
    <div class="logo-name">Boca'o</div>
    <div class="logo-sub">Panel de administración</div>
  </div>
  <div class="field">
    <label>Usuario</label>
    <input type="text" id="uInput" placeholder="Ingresa tu usuario" autocomplete="username"/>
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="pInput" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"/>
  </div>
  <button class="btn" onclick="login()">Entrar →</button>
  <div class="error" id="errBox">Usuario o contraseña incorrectos</div>
  <div class="version">Boca'o POS v2.0</div>
</div>

<script>
// CREDENCIALES — cambiar aquí si necesitas modificar claves
var USERS = {
  'admin':  { pass: 'bocao2025',   role: 'admin',  nombre: 'Administrador', redirect: '/panel.html' },
  'kelly':  { pass: 'kelly2025',   role: 'admin',  nombre: 'Kelly',         redirect: '/panel.html' },
  'cajero': { pass: 'cajero2025',  role: 'cajero', nombre: 'Cajero',        redirect: '/panel.html' }
};

function login(){
  var u=document.getElementById('uInput').value.trim().toLowerCase();
  var p=document.getElementById('pInput').value;
  var err=document.getElementById('errBox');
  if(!u||!p){err.textContent='Ingresa usuario y contraseña.';err.classList.add('show');return;}
  var user=USERS[u];
  if(!user||user.pass!==p){err.classList.add('show');err.textContent='Usuario o contraseña incorrectos';return;}
  sessionStorage.setItem('bocao_sess',JSON.stringify({user:u,role:user.role,nombre:user.nombre}));
  window.location.href=user.redirect;
}

// Si ya está logueado, redirigir
var sess=JSON.parse(sessionStorage.getItem('bocao_sess')||'null');
if(sess){
  window.location.href='/panel.html';
}
</script>
</body>
</html>
