<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boca'o — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600;1,9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0d0b09; --panel:#171310; --card:#1f1a15; --border:#332a1f;
  --gold:#E3B341; --gold-bright:#F0C868; --burgundy:#A5293B;
  --sage:#4FA875; --steel:#5B84A8; --text:#F3ECE2; --muted:#8C8172;
}
body{
  background:
    radial-gradient(ellipse 900px 600px at 50% -10%, rgba(227,179,65,.10), transparent 60%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  font-family:'Manrope',Arial,sans-serif;color:var(--text);
}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:40px 34px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.logo{text-align:center;margin-bottom:32px;}
.logo-icon{font-size:2.6rem;}
.logo-name{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:1.9rem;color:var(--gold);letter-spacing:.5px;margin-top:8px;}
.logo-sub{font-size:0.7rem;color:var(--muted);margin-top:6px;letter-spacing:2px;text-transform:uppercase;font-weight:600;}
.field{margin-bottom:16px;}
.field label{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px;}
.field input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:13px 15px;border-radius:11px;font-size:0.95rem;outline:none;font-family:inherit;transition:all .2s;}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,179,65,.15);}
.btn{width:100%;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1408;border:none;padding:15px;border-radius:11px;font-size:0.92rem;font-weight:800;cursor:pointer;margin-top:10px;letter-spacing:.5px;transition:all .2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(227,179,65,.3);}
.error{background:rgba(165,41,59,.15);border:1px solid var(--burgundy);color:#e79aa4;border-radius:9px;padding:10px 14px;font-size:0.8rem;margin-top:14px;display:none;text-align:center;}
.error.show{display:block;}
.version{text-align:center;margin-top:24px;font-size:0.66rem;color:var(--muted);opacity:.6;letter-spacing:.5px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🍔</div>
    <div class="logo-name">Boca'o</div>
    <div class="logo-sub">Panel de administración</div>
  </div>
  <div class="field">
    <label>Usuario</label>
    <input type="text" id="uInput" placeholder="Ingresa tu usuario" autocomplete="username"/>
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="pInput" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"/>
  </div>
  <button class="btn" onclick="login()">Entrar →</button>
  <div class="error" id="errBox">Usuario o contraseña incorrectos</div>
  <div class="version">Boca'o POS v2.0</div>
</div>

<script>
// CREDENCIALES — cambiar aquí si necesitas modificar claves
var USERS = {
  'admin':  { pass: 'bocao2025',   role: 'admin',  nombre: 'Administrador', redirect: '/panel.html' },
  'kelly':  { pass: 'kelly2025',   role: 'admin',  nombre: 'Kelly',         redirect: '/panel.html' },
  'cajero': { pass: 'cajero2025',  role: 'cajero', nombre: 'Cajero',        redirect: '/panel.html' }
};

function login(){
  var u=document.getElementById('uInput').value.trim().toLowerCase();
  var p=document.getElementById('pInput').value;
  var err=document.getElementById('errBox');
  if(!u||!p){err.textContent='Ingresa usuario y contraseña.';err.classList.add('show');return;}
  var user=USERS[u];
  if(!user||user.pass!==p){err.classList.add('show');err.textContent='Usuario o contraseña incorrectos';return;}
  sessionStorage.setItem('bocao_sess',JSON.stringify({user:u,role:user.role,nombre:user.nombre}));
  window.location.href=user.redirect;
}

// Si ya está logueado, redirigir
var sess=JSON.parse(sessionStorage.getItem('bocao_sess')||'null');
if(sess){
  window.location.href='/panel.html';
}
</script>
</body>
</html>
